<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>单词闪电跑酷 (Word Dash) - 新春马年版</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+SC:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #B71C1C; /* 深红背景 */
            font-family: 'Noto Sans SC', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            display: block;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5); /* 更深的阴影 */
            border-radius: 4px; /* 轻微圆角 */
        }

        /* 界面覆盖层 - 玻璃拟态 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(183, 28, 28, 0.85); /* 深红半透明 */
            backdrop-filter: blur(8px); /* 毛玻璃 */
            z-index: 10;
            transition: opacity 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* 标题设计 */
        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 3.5rem;
            background: linear-gradient(to bottom, #FFD700, #FFA000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 4px 0px #8B0000);
            margin-bottom: 0.5rem;
            text-align: center;
            letter-spacing: 2px;
            transform: rotate(-3deg); /* 俏皮倾斜 */
            animation: floatTitle 3s ease-in-out infinite;
        }

        @keyframes floatTitle {
            0%, 100% { transform: rotate(-3deg) translateY(0); }
            50% { transform: rotate(-3deg) translateY(-10px); }
        }

        .subtitle {
            font-size: 1.2rem;
            color: #FFECB3;
            margin-bottom: 2rem;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            background: rgba(0,0,0,0.2);
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* 3D果冻按钮 */
        .btn {
            position: relative;
            background: linear-gradient(to bottom, #FFEB3B, #FBC02D);
            border: none;
            padding: 15px 60px;
            font-size: 1.8rem;
            color: #E65100;
            border-radius: 60px;
            cursor: pointer;
            font-family: 'Fredoka One', cursive;
            box-shadow: 0 8px 0 #F57F17, 0 15px 20px rgba(0,0,0,0.2);
            transition: all 0.1s ease;
            margin: 15px;
            text-transform: uppercase;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #F57F17, 0 5px 10px rgba(0,0,0,0.2);
        }
        
        .btn:hover {
            filter: brightness(1.1);
        }

        /* HUD 设计 */
        #hud {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
        }

        .hud-item {
            background: #FFF;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 800;
            color: #D32F2F;
            font-size: 1.2rem;
            border-bottom: 4px solid #EF9A9A;
            min-width: 90px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Fredoka One', cursive; /* 统一字体 */
        }
        
        /* 结算面板卡片 */
        #result-content {
            background: #FFF;
            color: #333;
            padding: 30px;
            border-radius: 30px;
            width: 90%;
            max-width: 480px;
            max-height: 75vh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 6px solid #FFD700;
            position: relative;
        }
        
        /* 滚动条美化 */
        #result-content::-webkit-scrollbar {
            width: 8px;
        }
        #result-content::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        #result-content::-webkit-scrollbar-thumb {
            background: #FFD54F;
            border-radius: 4px;
        }

        .word-list {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            text-align: left;
        }

        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: #FAFAFA;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        
        .word-item:hover {
            transform: scale(1.02);
        }

        .word-item.wrong {
            background-color: #FFEBEE;
            border-left: 5px solid #EF5350;
        }
        
        .word-item.correct {
            background-color: #E8F5E9;
            border-left: 5px solid #66BB6A;
        }

        .audio-btn {
            background: #fff;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }
        
        .audio-btn:hover {
            background: #2196F3;
            color: white;
            transform: scale(1.1);
        }
        
        .controls-hint {
            margin-top: 25px; 
            font-size: 1rem; 
            color: #FFD700; 
            background: rgba(0,0,0,0.4); 
            padding: 8px 20px; 
            border-radius: 30px;
            font-weight: bold;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- 开始界面 -->
    <div id="start-screen" class="overlay">
        <h1>🧨 单词奔腾 🐎</h1>
        <p style="font-size: 1.3rem; margin-bottom: 5px; font-weight: bold; color: #FFF;">新春特别版</p>
        <p style="font-size: 0.9rem; margin-bottom: 30px; opacity: 0.9;">Unit 1 - Unit 8 全词汇</p>
        
        <button class="btn" onclick="startGame()">开始挑战</button>
        
        <div class="controls-hint">
            ⌨️ 键盘 ← → 移动 &nbsp;|&nbsp; 👆 点击屏幕两侧移动
        </div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
        <div class="hud-item" style="color: #D32F2F;">❤️ <span id="lives">3</span></div>
        <div id="score-container" class="hud-item" style="color: #FF8F00;">⭐ <span id="score">0</span></div>
        <div class="hud-item" style="color: #1976D2;">🎯 <span id="progress">0/15</span></div>
    </div>

    <!-- 结算界面 -->
    <div id="game-over-screen" class="overlay hidden">
        <h1 id="end-title">恭喜发财!</h1>
        <div id="result-content">
            <h2 id="final-score" style="color:#D32F2F; margin-bottom:5px;">得分: 0</h2>
            <div id="star-rating" style="font-size: 1.5rem; margin-bottom: 15px;"></div>
            
            <h3 style="text-align: left; border-bottom: 2px solid #FFCDD2; padding-bottom: 5px; font-size:1rem; color:#D32F2F;">本次单词回顾</h3>
            <ul id="word-review-list" class="word-list">
                <!-- 动态生成 -->
            </ul>
            <button class="btn btn-blue" onclick="startGame()">再玩一次</button>
        </div>
    </div>
</div>

<script>
    /**
     * 游戏配置
     */
    const AUDIO_BASE_URL = "https://dict.youdao.com/dictvoice?type=2&audio=";
    
    // 词库更新: 四年级上册全学期词汇 (Unit 1 - Unit 8)
    const VOCABULARY = [
        // Unit 1
        { word: "city", meaning: "城市" }, { word: "building", meaning: "建筑物" },
        { word: "flat", meaning: "公寓" }, { word: "street", meaning: "街道" },
        { word: "country", meaning: "国家" }, { word: "farm", meaning: "农场" },
        { word: "house", meaning: "房子" }, { word: "live", meaning: "居住" },
        // Unit 2
        { word: "eagle", meaning: "老鹰" }, { word: "owl", meaning: "猫头鹰" },
        { word: "honeybee", meaning: "蜜蜂" }, { word: "forest", meaning: "森林" },
        { word: "nest", meaning: "鸟巢" },
        // Unit 3
        { word: "odd", meaning: "奇数" }, { word: "even", meaning: "偶数" },
        { word: "plus", meaning: "加" }, { word: "minus", meaning: "减" },
        { word: "number", meaning: "数字" },
        // Unit 4
        { word: "supermarket", meaning: "超市" }, { word: "rice", meaning: "米饭" },
        { word: "juice", meaning: "果汁" }, { word: "biscuit", meaning: "饼干" },
        // Unit 5
        { word: "spring", meaning: "春天" }, { word: "summer", meaning: "夏天" },
        { word: "autumn", meaning: "秋天" }, { word: "winter", meaning: "冬天" },
        { word: "warm", meaning: "温暖" }, { word: "cold", meaning: "寒冷" },
        // Unit 6
        { word: "plant", meaning: "植物" }, { word: "flower", meaning: "花" },
        { word: "fruit", meaning: "水果" }, { word: "seed", meaning: "种子" },
        // Unit 7
        { word: "traffic", meaning: "交通" }, { word: "light", meaning: "灯" },
        { word: "wait", meaning: "等待" }, { word: "stop", meaning: "停止" },
        // Unit 8
        { word: "busy", meaning: "忙碌" }, { word: "cook", meaning: "做饭" },
        { word: "wash", meaning: "洗" }
    ];

    const GAME_SPEED_INITIAL = 0.52; // 提速 50% (0.35 * 1.5)
    const SPEED_INCREMENT = 0.02; 
    const TOTAL_QUESTIONS = VOCABULARY.length;

    // 新年配色泡泡 -> 升级为高饱和度糖果色
    const BUBBLE_COLORS = [
        '#FF4081', // 艳粉
        '#7C4DFF', // 深紫
        '#00E5FF', // 亮青
        '#00E676', // 荧光绿
        '#FFAB00', // 亮橙
        '#FF3D00', // 猩红
        '#2979FF', // 宝蓝
        '#F50057'  // 这里的颜色更鲜艳，能从背景中跳出来
    ];

    function getRandomColor() {
        return BUBBLE_COLORS[Math.floor(Math.random() * BUBBLE_COLORS.length)];
    }

    /**
     * 游戏状态
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let gameState = {
        isRunning: false,
        score: 0,
        lives: 3,
        speed: GAME_SPEED_INITIAL,
        playerLane: 1, 
        items: [],     
        particles: [], 
        fireworks: [], 
        coins: [], 
        floatingTexts: [], 
        decorations: [], 
        clouds: [],      
        currentTask: null, 
        questionsAnswered: 0,
        currentStreak: 0,
        spawnCooldown: 0,
        history: [],
        frameCount: 0,
        usedIndices: new Set()
    };

    let lastTime = 0;
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    /**
     * 音效系统
     */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'correct') {
            osc.type = 'triangle'; // 更欢快的音色
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'coin') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1500, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'firework') {
            // 简单的爆竹声
            const bufferSize = audioCtx.sampleRate * 0.3;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            noise.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start();
        }
    }

    function playWordAudio(word) {
        const audio = new Audio(AUDIO_BASE_URL + encodeURIComponent(word));
        audio.play().catch(e => console.warn("Audio fail:", e));
    }

    /**
     * 核心逻辑
     */
    function generateNewTask() {
        if (gameState.questionsAnswered >= TOTAL_QUESTIONS) {
            gameOver(true);
            return;
        }

        let availableIndices = [];
        if (!gameState.usedIndices) gameState.usedIndices = new Set();
        for(let i=0; i<VOCABULARY.length; i++) {
            if(!gameState.usedIndices.has(i)) availableIndices.push(i);
        }
        
        let targetIndex;
        if (availableIndices.length > 0) {
            const randomIndex = Math.floor(Math.random() * availableIndices.length);
            targetIndex = availableIndices[randomIndex];
            gameState.usedIndices.add(targetIndex);
        } else {
            targetIndex = Math.floor(Math.random() * VOCABULARY.length);
        }

        const targetWord = VOCABULARY[targetIndex];
        const mode = Math.random() > 0.5 ? 'CN_to_EN' : 'EN_to_CN';
        
        gameState.currentTask = {
            ...targetWord,
            mode: mode,
            processing: false
        };

        spawnItemRow(targetWord, mode);
    }

    function spawnItemRow(targetWord, mode) {
        const laneIndices = [0, 1, 2].sort(() => Math.random() - 0.5);
        const startY = -300; 
        
        // 确保一行三个气泡颜色各不相同，避免撞色
        const shuffledColors = [...BUBBLE_COLORS].sort(() => 0.5 - Math.random());
        
        const isTargetEnglish = (mode === 'CN_to_EN'); 
        
        gameState.items.push({
            type: 'word',
            displayText: isTargetEnglish ? targetWord.word : targetWord.meaning, 
            word: targetWord.word, 
            isTarget: true,
            lane: laneIndices[0],
            y: startY,
            color: shuffledColors[0]
        });

        let wrong1 = getDistractor(targetWord);
        gameState.items.push({
            type: 'word',
            displayText: isTargetEnglish ? wrong1.word : wrong1.meaning,
            word: wrong1.word,
            isTarget: false,
            lane: laneIndices[1],
            y: startY,
            color: shuffledColors[1]
        });

        let wrong2 = getDistractor(targetWord, wrong1);
        gameState.items.push({
            type: 'word',
            displayText: isTargetEnglish ? wrong2.word : wrong2.meaning,
            word: wrong2.word,
            isTarget: false,
            lane: laneIndices[2],
            y: startY,
            color: shuffledColors[2]
        });
    }

    function getDistractor(target, exclude = null) {
        let distractor;
        let attempts = 0;
        do {
            distractor = VOCABULARY[Math.floor(Math.random() * VOCABULARY.length)];
            attempts++;
        } while ((distractor.word === target.word || (exclude && distractor.word === exclude.word)) && attempts < 20);
        return distractor;
    }

    // 生成装饰物 (灯笼/梅花树/小动物/彩旗)
    function spawnDecoration(y) {
        const side = Math.random() > 0.5 ? 'left' : 'right';
        const laneWidth = canvas.width / 4;
        const centerX = canvas.width / 2;
        
        let x;
        if (side === 'left') {
            x = Math.random() * (centerX - laneWidth * 1.6);
        } else {
            x = (centerX + laneWidth * 1.6) + Math.random() * (centerX - laneWidth * 1.6);
        }

        const rand = Math.random();
        let type, scale;
        
        if (rand > 0.7) {
            type = 'lantern_tree'; // 挂红灯笼的树
            scale = 0.8 + Math.random() * 0.4;
        } else if (rand > 0.4) {
            type = 'animal'; // 围观小动物
            // 2. 调大动物尺寸 (与主角相当，约1.5-2.0倍原比例)
            scale = 1.6 + Math.random() * 0.4; 
        } else {
            type = 'flag'; // 彩旗
            scale = 0.7 + Math.random() * 0.3;
        }

        gameState.decorations.push({
            x: x,
            y: y !== undefined ? y : -100, // 支持指定Y坐标
            type: type,
            scale: scale,
            animalType: ['🐼','🐰','🐯','🐥'][Math.floor(Math.random()*4)]
        });
    }

    // 生成祥云
    function spawnCloud() {
        gameState.clouds.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height * 0.4,
            size: 45 + Math.random() * 60, // 3. 增加云朵大小 (平均增加50%)
            speed: 0.2 + Math.random() * 0.5
        });
    }

    function spawnFirework(x, y) {
        playBeep('firework');
        for (let i = 0; i < 80; i++) {
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 6 + 2;
            const color = `hsl(${Math.random() * 60 + 330}, 100%, 60%)`; // 红色/金色系烟花
            
            gameState.fireworks.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * velocity,
                vy: Math.sin(angle) * velocity,
                color: color,
                alpha: 1,
                life: 1.0,
                decay: Math.random() * 0.015 + 0.01,
                gravity: 0.1
            });
        }
    }

    function updateFireworks() {
        for (let i = gameState.fireworks.length - 1; i >= 0; i--) {
            let p = gameState.fireworks[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.life -= p.decay;
            p.alpha = p.life;
            p.vx *= 0.95;
            p.vy *= 0.95;
            if (p.life <= 0) gameState.fireworks.splice(i, 1);
        }
    }

    function drawFireworks() {
        ctx.globalCompositeOperation = 'lighter';
        gameState.fireworks.forEach(p => {
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
        ctx.globalCompositeOperation = 'source-over';
    }

    function gameLoop(timestamp) {
        if (!gameState.isRunning) return;

        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;

        update(deltaTime);
        draw();

        requestAnimationFrame(gameLoop);
    }

    function update(deltaTime) {
        if (!gameState.isRunning) return;
        
        // 震动衰减
        if (gameState.shake > 0) {
            gameState.shake *= 0.9;
            if (gameState.shake < 0.5) gameState.shake = 0;
        }

        gameState.frameCount++;
        // 1. 移除速度递增逻辑，保持恒定速度
        gameState.speed = GAME_SPEED_INITIAL;

        // 2. 减少装饰物密度 (100 -> 200 帧生成一次)
        if (gameState.frameCount % 200 === 0) spawnDecoration();
        for (let i = gameState.decorations.length - 1; i >= 0; i--) {
            let d = gameState.decorations[i];
            d.y += gameState.speed; 
            if (d.y > canvas.height + 100) gameState.decorations.splice(i, 1);
        }

        gameState.clouds.forEach(c => {
            c.x += c.speed;
            if (c.x > canvas.width + 100) c.x = -100;
        });
        
        // 3. 严格控制云朵生成，防止堆积
        if (gameState.clouds.length < 3 && Math.random() < 0.005) spawnCloud();

        for (let i = gameState.items.length - 1; i >= 0; i--) {
            if (i >= gameState.items.length) break;
            let item = gameState.items[i];
            if (!item) continue;

            item.y += gameState.speed * 3.5;

            // 碰撞检测优化: 确保只触发一次
            if (!item.hit && checkCollision(item)) {
                handleCollision(item);
                item.hit = true; // 标记为已撞击
                
                // 如果碰撞导致任务结束（答对或答错），handleCollision -> handleWrong 会清空 items
                // 所以这里可以直接 break
                if (gameState.currentTask && gameState.currentTask.processing) break;
                
                // 如果是金币或其他不结束任务的物品，移除它
                gameState.items.splice(i, 1);
                continue;
            }

            if (item.y > canvas.height + 100) {
                gameState.items.splice(i, 1);
                if (item.isTarget) {
                    handleWrong("missed");
                    if (gameState.currentTask && gameState.currentTask.processing) break;
                }
            }
        }

        const targetX = canvas.width / 2;
        const targetY = 40; 
        for (let i = gameState.coins.length - 1; i >= 0; i--) {
            let c = gameState.coins[i];
            c.x += (targetX - c.x) * 0.1;
            c.y += (targetY - c.y) * 0.1;
            
            if (Math.abs(c.y - targetY) < 10) {
                gameState.score += 100;
                playBeep('coin');
                document.getElementById('score').innerText = gameState.score;
                gameState.coins.splice(i, 1);
            }
        }

        for (let i = gameState.floatingTexts.length - 1; i >= 0; i--) {
            let ft = gameState.floatingTexts[i];
            ft.y -= 2;
            ft.life -= 0.02;
            if (ft.life <= 0) gameState.floatingTexts.splice(i, 1);
        }

        // 更新粒子
        if (gameState.particles) {
            gameState.particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                p.vy += 0.2;
            });
            gameState.particles = gameState.particles.filter(p => p.life > 0);
        }
        
        updateFireworks();

        if (gameState.currentTask) {
             if (gameState.currentTask.processing) {
                 if (gameState.spawnCooldown > 0) {
                     gameState.spawnCooldown--;
                 } else {
                     generateNewTask();
                 }
             }
        } else {
            generateNewTask();
        }
    }

    function checkCollision(item) {
        const playerY = canvas.height - 180; 
        const hitRangeY = 70; 
        if (item.lane !== gameState.playerLane) return false;
        if (Math.abs(item.y - playerY) < hitRangeY) return true;
        return false;
    }

    function handleCollision(item) {
        if (item.type === 'word') {
            playWordAudio(item.word);
            
            if (item.isTarget) {
                handleCorrect(item.lane, canvas.height - 180);
                createParticles(item.lane, canvas.height - 150, '#FFD700');
            } else {
                handleWrong("wrong", item.lane, canvas.height - 180);
                createParticles(item.lane, canvas.height - 150, '#D32F2F');
            }
        }
    }

    function handleCorrect(lane, y) {
        const startX = getLaneX(gameState.playerLane);
        gameState.coins.push({ x: startX, y: y });
        
        // 粒子爆炸效果
        spawnExplosion(startX, y, '#FFD700'); // 金色爆炸
        spawnExplosion(startX, y, '#FFF');    // 白色闪光
        
        playBeep('correct');
        
        gameState.questionsAnswered++;
        gameState.currentStreak++; 
        
        document.getElementById('progress').innerText = `${gameState.questionsAnswered}/${TOTAL_QUESTIONS}`;

        gameState.history.push({
            word: gameState.currentTask.word, 
            meaning: gameState.currentTask.meaning, 
            result: 'correct'
        });
        
        if (gameState.currentStreak > 0 && gameState.currentStreak % 3 === 0) {
            spawnFirework(canvas.width / 2, canvas.height / 3);
            setTimeout(() => spawnFirework(canvas.width / 3, canvas.height / 4), 200);
            setTimeout(() => spawnFirework(canvas.width * 2 / 3, canvas.height / 4), 400);
            
            gameState.floatingTexts.push({
                x: canvas.width / 2,
                y: canvas.height / 2,
                text: "好样的! 🧨",
                color: "#FFD700",
                life: 3.0, 
                size: 60
            });
        }
        
        finishCurrentTask(60); 
    }

    function handleWrong(type, lane, y) {
        loseLife();
        playBeep('wrong'); 
        gameState.currentStreak = 0; 
        
        triggerShake(20); // 触发屏幕震动
        
        if (lane !== undefined) {
            gameState.floatingTexts.push({
                x: getLaneX(lane),
                y: y,
                text: "❌",
                color: "#D32F2F",
                life: 1.0,
                size: 60
            });
        }

        gameState.history.push({
            word: gameState.currentTask.word, 
            meaning: gameState.currentTask.meaning, 
            result: type
        });
        
        gameState.questionsAnswered++;
        document.getElementById('progress').innerText = `${gameState.questionsAnswered}/${TOTAL_QUESTIONS}`;
        finishCurrentTask(60);
    }
    
    function finishCurrentTask(cooldown) {
        if (gameState.currentTask) gameState.currentTask.processing = true;
        gameState.spawnCooldown = cooldown;
        
        for (let i = gameState.items.length - 1; i >= 0; i--) {
            if (gameState.items[i].type === 'word') {
                gameState.items.splice(i, 1);
            }
        }
    }

    function loseLife() {
        gameState.lives--;
        document.getElementById('lives').innerText = gameState.lives;
        
        const flash = document.createElement('div');
        flash.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;background:#D32F2F;opacity:0.3;z-index:9;pointer-events:none;transition:opacity 0.2s;';
        document.body.appendChild(flash);
        setTimeout(() => flash.style.opacity = 0, 100);
        setTimeout(() => flash.remove(), 300);

        if (gameState.lives <= 0) {
            setTimeout(() => gameOver(false), 500);
        }
    }

    /**
     * 绘图
     */
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        
        // 应用屏幕震动
        if (gameState.shake > 0) {
            const dx = (Math.random() - 0.5) * gameState.shake;
            const dy = (Math.random() - 0.5) * gameState.shake;
            ctx.translate(dx, dy);
        }

        drawRoad();
        drawDecorations();
        drawClouds(); // 云朵在地上投下影子? 放在路面上层
        
        drawPlayer();
        
        gameState.items.forEach(drawItem);
        drawParticles(); // 绘制新加入的粒子
        drawFireworks();
        drawCoins();
        drawFloatingTexts();
        
        ctx.restore(); // 震动结束，UI层不受震动影响

        // 绘制暗角 (Vignette) - 增加电影感 (暖色调)
        const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.height*0.4, canvas.width/2, canvas.height/2, canvas.height);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(255, 112, 67, 0.3)'); // 暖橙色暗角
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,canvas.width, canvas.height);
    }
    
    function drawParticles() {
        gameState.particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        });
    }

    function getLaneX(laneIndex) {
        const laneWidth = canvas.width / 4;
        const centerX = canvas.width / 2;
        if (laneIndex === 0) return centerX - laneWidth;
        if (laneIndex === 1) return centerX;
        if (laneIndex === 2) return centerX + laneWidth;
        return centerX;
    }

    function drawClouds() {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        gameState.clouds.forEach(c => {
            // 简单的祥云 (由几个圆组成)
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
            ctx.arc(c.x + c.size * 0.7, c.y + c.size * 0.2, c.size * 0.6, 0, Math.PI * 2);
            ctx.arc(c.x - c.size * 0.7, c.y + c.size * 0.2, c.size * 0.6, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function drawRoad() {
        const laneWidth = canvas.width / 4;
        const centerX = canvas.width / 2;
        const roadLeft = centerX - laneWidth * 1.5;
        const roadRight = centerX + laneWidth * 1.5;
        
        // 1. 背景草地 -> 暖奶油底 (Warm Cream)
        ctx.fillStyle = '#FFF7E6'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 路面底色 (稍微深一点的奶油色，用于衬托)
        ctx.fillStyle = '#FFE0B2';
        ctx.fillRect(roadLeft, 0, roadRight - roadLeft, canvas.height);

        // 2. 三色跑道 (落日糖果系)
        const leftLaneX = centerX - laneWidth * 1.5;
        const centerLaneX = centerX - laneWidth * 0.5;
        const rightLaneX = centerX + laneWidth * 0.5;

        // 左跑道: #FF6B6B (柔和红粉)
        ctx.fillStyle = '#FF6B6B'; 
        ctx.fillRect(leftLaneX, 0, laneWidth, canvas.height);
        
        // 中跑道: #FFD166 (暖黄)
        ctx.fillStyle = '#FFD166'; 
        ctx.fillRect(centerLaneX, 0, laneWidth, canvas.height);
        
        // 右跑道: #4D96FF (清爽蓝)
        ctx.fillStyle = '#4D96FF'; 
        ctx.fillRect(rightLaneX, 0, laneWidth, canvas.height);
        
        // 3. 绘制纹理
        ctx.save();
        ctx.beginPath();
        ctx.rect(roadLeft, 0, roadRight - roadLeft, canvas.height);
        ctx.clip();
        
        const decorScroll = (Date.now() / 20) % 120;
        
        for (let y = -120; y < canvas.height + 120; y += 120) {
            const dy = y + decorScroll;
            
            // 左跑道 (#FF6B6B): 白色纹理
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)'; 
            drawDiamond(leftLaneX + laneWidth/2, dy);
            
            // 中跑道 (#FFD166): 白色纹理
            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)'; 
            drawCirclePattern(centerLaneX + laneWidth/2, dy, '#FFD166');
            
            // 右跑道 (#4D96FF): 白色纹理
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)'; 
            drawTrianglePattern(rightLaneX + laneWidth/2, dy);
        }
        ctx.restore();
        
        // 分隔线 -> 纯白虚线
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; 
        ctx.lineWidth = 5;
        ctx.setLineDash([40, 40]); 
        
        ctx.beginPath();
        ctx.moveTo(centerX - laneWidth/2, 0);
        ctx.lineTo(centerX - laneWidth/2, canvas.height);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(centerX + laneWidth/2, 0);
        ctx.lineTo(centerX + laneWidth/2, canvas.height);
        ctx.stroke();
        
        ctx.setLineDash([]); 
        
        // 边线 -> 暖橙边线
        ctx.strokeStyle = '#FFCC80';
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(roadLeft + 5, 0);
        ctx.lineTo(roadLeft + 5, canvas.height);
        ctx.moveTo(roadRight - 5, 0);
        ctx.lineTo(roadRight - 5, canvas.height);
        ctx.stroke();
    }
    
    // 纹理绘制辅助函数
    function drawDiamond(cx, cy) {
        ctx.beginPath();
        ctx.moveTo(cx, cy - 20);
        ctx.lineTo(cx + 20, cy);
        ctx.lineTo(cx, cy + 20);
        ctx.lineTo(cx - 20, cy);
        ctx.fill();
    }

    function drawCirclePattern(cx, cy, laneColor) {
        ctx.beginPath();
        ctx.arc(cx, cy, 18, 0, Math.PI*2);
        ctx.fill();
        // 中间孔洞
        ctx.fillStyle = laneColor || '#FFD166'; 
        ctx.beginPath();
        ctx.rect(cx - 6, cy - 6, 12, 12);
        ctx.fill();
        // 恢复实际上不需要，因为每次循环都会重置fillStyle
    }

    function drawTrianglePattern(cx, cy) {
        ctx.beginPath();
        ctx.moveTo(cx, cy - 20);
        ctx.lineTo(cx + 20, cy + 15);
        ctx.lineTo(cx - 20, cy + 15);
        ctx.fill();
    }

    function drawDecorations() {
        gameState.decorations.forEach(d => {
            const cx = d.x;
            const cy = d.y;
            const s = d.scale;

            // 阴影
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 20*s, 20*s, 8*s, 0, 0, Math.PI*2);
            ctx.fill();

            if (d.type === 'lantern_tree' || d.type === 'tree') { // 兼容旧数据tree
                // 树干
                ctx.fillStyle = '#5D4037';
                ctx.fillRect(cx - 5*s, cy - 50*s, 10*s, 70*s);
                // 树冠
                ctx.fillStyle = '#2E7D32'; // 深绿
                ctx.beginPath();
                ctx.arc(cx, cy - 60*s, 35*s, 0, Math.PI*2);
                ctx.arc(cx - 20*s, cy - 40*s, 25*s, 0, Math.PI*2);
                ctx.arc(cx + 20*s, cy - 40*s, 25*s, 0, Math.PI*2);
                ctx.fill();
                
                if (d.type === 'lantern_tree') {
                    // 红灯笼
                    ctx.fillStyle = '#D32F2F';
                    ctx.beginPath();
                    ctx.arc(cx - 15*s, cy - 50*s, 8*s, 0, Math.PI*2);
                    ctx.arc(cx + 18*s, cy - 35*s, 8*s, 0, Math.PI*2);
                    ctx.arc(cx + 5*s, cy - 65*s, 8*s, 0, Math.PI*2);
                    ctx.fill();
                    // 穗子
                    ctx.strokeStyle = '#FFD700';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(cx - 15*s, cy - 42*s); ctx.lineTo(cx - 15*s, cy - 35*s);
                    ctx.moveTo(cx + 18*s, cy - 27*s); ctx.lineTo(cx + 18*s, cy - 20*s);
                    ctx.stroke();
                } else {
                     // 旧的梅花逻辑保留
                    ctx.fillStyle = '#F06292';
                    ctx.beginPath();
                    ctx.arc(cx - 20*s, cy - 50*s, 6*s, 0, Math.PI*2);
                    ctx.fill();
                }

            } else if (d.type === 'animal') {
                // 小动物观众
                ctx.save();
                
                // 1. 确保完全不透明
                ctx.globalAlpha = 1.0; 
                
                ctx.font = `${40 * s}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                
                // 让小动物跳动
                const jump = Math.sin(Date.now() / 150 + cx) * 5;
                const ay = cy + 20*s - jump;

                // 2. 白色轮廓/光晕 (让它们从红色背景中跳出来)
                ctx.lineJoin = 'round';
                ctx.miterLimit = 2;
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#fff';
                ctx.strokeText(d.animalType || '🐼', cx, ay);
                
                // 3. 绘制实体 Emoji
                ctx.fillStyle = '#000'; // 虽然Emoji自带颜色，但有些浏览器需要reset fillStyle
                ctx.fillText(d.animalType || '🐼', cx, ay);
                
                ctx.restore();
                
            } else if (d.type === 'flag') {
                 // 彩旗杆
                ctx.strokeStyle = '#795548';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(cx, cy + 20*s);
                ctx.lineTo(cx, cy - 60*s);
                ctx.stroke();
                
                // 彩色旗面
                ctx.fillStyle = cx % 2 > 0 ? '#FFC107' : '#FF5722'; 
                ctx.beginPath();
                ctx.moveTo(cx, cy - 60*s);
                ctx.lineTo(cx + 30*s, cy - 45*s);
                ctx.lineTo(cx, cy - 30*s);
                ctx.fill();

            } else {
                // 旧灯笼逻辑或其他
                // 线
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy - 50*s);
                ctx.lineTo(cx, cy - 20*s);
                ctx.stroke();
                
                // 灯笼体
                ctx.fillStyle = '#D32F2F';
                ctx.beginPath();
                ctx.ellipse(cx, cy, 25*s, 20*s, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#FFD700';
                ctx.fillRect(cx - 10*s, cy - 20*s, 20*s, 4*s);
                ctx.fillRect(cx - 10*s, cy + 18*s, 20*s, 4*s);
            }
        });
    }

    function drawPlayer() {
        const x = getLaneX(gameState.playerLane);
        const y = canvas.height - 180;
        const bounce = Math.sin(Date.now() / 150) * 8; 
        const wobble = Math.sin(Date.now() / 100) * 3; 

        // 1. 影子
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(x, y + 45, 35 - bounce, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        // --- 小马绘制 (背影版 - 向前跑) ---
        
        // 1. 后腿 (在最下面，动态蹬地)
        const runCycle = Math.sin(Date.now() / 80);
        ctx.fillStyle = '#E65100'; // 深色腿
        ctx.beginPath();
        // 左腿
        ctx.ellipse(x - 15, y + 40 + bounce + (runCycle*8), 10, 15, 0.2, 0, Math.PI*2);
        // 右腿
        ctx.ellipse(x + 15, y + 40 + bounce - (runCycle*8), 10, 15, -0.2, 0, Math.PI*2);
        ctx.fill();

        // 2. 屁股/身体 (圆润的橙色)
        ctx.fillStyle = '#FB8C00'; 
        ctx.beginPath();
        ctx.ellipse(x, y + 20 + bounce, 32, 28, 0, 0, Math.PI * 2); // 屁股大一点
        ctx.fill();
        
        // 3. 尾巴 (在屁股后面甩动)
        const tailWag = Math.sin(Date.now() / 100) * 15;
        ctx.strokeStyle = '#FDD835'; // 金色尾巴
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x, y + 20 + bounce);
        ctx.quadraticCurveTo(x + tailWag, y + 45 + bounce, x + tailWag*1.5, y + 60 + bounce);
        ctx.stroke();

        // 4. 头部 (后脑勺，比身体小，位置高)
        ctx.fillStyle = '#FB8C00';
        ctx.beginPath();
        ctx.ellipse(x, y - 20 + bounce + wobble, 24, 26, 0, 0, Math.PI*2);
        ctx.fill();
        
        // 5. 耳朵 (在后脑勺两侧)
        ctx.fillStyle = '#E65100'; // 耳背深色
        ctx.beginPath();
        ctx.moveTo(x - 15, y - 35 + bounce);
        ctx.lineTo(x - 25, y - 55 + bounce); // 向外指
        ctx.lineTo(x - 8, y - 45 + bounce);
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(x + 15, y - 35 + bounce);
        ctx.lineTo(x + 25, y - 55 + bounce);
        ctx.lineTo(x + 8, y - 45 + bounce);
        ctx.fill();

        // 6. 鬃毛 (背后的毛发)
        ctx.fillStyle = '#FDD835';
        ctx.beginPath();
        ctx.moveTo(x, y - 45 + bounce);
        ctx.quadraticCurveTo(x, y - 5 + bounce, x, y + 10 + bounce); // 垂下来
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#FDD835';
        ctx.stroke();

        // 题目显示气泡 (保持在头顶)
        if (gameState.currentTask && !gameState.currentTask.processing) {
            const bubbleY = y - 90 + bounce;
            
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath();
            ctx.ellipse(x + 5, bubbleY + 5, 80, 40, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.ellipse(x, bubbleY, 80, 40, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x, bubbleY + 40);
            ctx.lineTo(x - 10, bubbleY + 30);
            ctx.lineTo(x + 10, bubbleY + 30);
            ctx.fill();
            
            ctx.fillStyle = '#333';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const text = gameState.currentTask.mode === 'CN_to_EN' 
                ? gameState.currentTask.meaning 
                : gameState.currentTask.word;   
            
            // 卡通文字效果
            if (/[a-zA-Z]/.test(text)) {
                ctx.font = 'bold 26px "Fredoka One"';
            } else {
                ctx.font = '900 30px "Noto Sans SC"'; 
            }

            ctx.lineWidth = 5;
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#fff';
            ctx.strokeText(text, x, bubbleY);

            ctx.fillStyle = '#333';
            ctx.fillText(text, x, bubbleY);
        }
    }

    function drawItem(item) {
        const x = getLaneX(item.lane);
        
        if (item.type === 'word') {
            // 根据文字长度动态计算宽度
            // 先设置字体以便 measureText 准确
            if (/[a-zA-Z]/.test(item.displayText)) {
                ctx.font = 'bold 24px "Fredoka One"';
            } else {
                ctx.font = 'bold 26px "Noto Sans SC"';
            }
            
            const textMetrics = ctx.measureText(item.displayText);
            const textWidth = textMetrics.width;
            const boxWidth = Math.max(100, textWidth + 50); // 最小宽度100
            const boxHeight = 60; // 胶囊高度
            const radius = boxHeight / 2; // 圆角半径
            
            // 哑光糖果质感
            const grad = ctx.createLinearGradient(x - boxWidth/2, item.y - boxHeight/2, x + boxWidth/2, item.y + boxHeight/2);
            grad.addColorStop(0, item.color);
            grad.addColorStop(1, adjustColor(item.color, -20)); 

            ctx.fillStyle = grad;
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 4;
            
            // 绘制胶囊体
            ctx.beginPath();
            ctx.roundRect(x - boxWidth/2, item.y - boxHeight/2, boxWidth, boxHeight, radius);
            ctx.fill();
            
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.roundRect(x - boxWidth/2, item.y - boxHeight/2, boxWidth, boxHeight, radius);
            ctx.stroke();

            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 2;
            
            ctx.fillText(item.displayText, x, item.y);
            
            ctx.shadowBlur = 0;
        }
    }

    function adjustColor(color, amount) {
        return color; 
    }

    function drawCoins() {
        gameState.coins.forEach(c => {
            // 金元宝/金币
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(c.x, c.y, 16, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#FFA000';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#D32F2F'; // 红色字
            ctx.font = 'bold 16px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('福', c.x, c.y); // 金币上写福字
        });
    }

    function drawFloatingTexts() {
        gameState.floatingTexts.forEach(ft => {
            ctx.globalAlpha = ft.life;
            ctx.fillStyle = ft.color;
            ctx.font = `bold ${ft.size}px "Noto Sans SC"`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'white';
            ctx.shadowBlur = 5;
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.shadowBlur = 0;
        });
        ctx.globalAlpha = 1.0;
    }

    function createParticles(lane, y, color) {
        const x = getLaneX(lane);
        for(let i=0; i<15; i++) {
            gameState.particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 15,
                vy: (Math.random() - 0.5) * 15,
                life: 1.0, color: color
            });
        }
    }

    function updateParticles() {
        for(let i=gameState.particles.length-1; i>=0; i--) {
            let p = gameState.particles[i];
            p.x += p.vx; p.y += p.vy;
            p.life -= 0.05;
            if(p.life <= 0) gameState.particles.splice(i, 1);
        }
    }

    function drawParticles() {
        gameState.particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5 + Math.random()*3, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }

    // 控制
    function movePlayer(direction) {
        if (!gameState.isRunning) return;
        if (direction === 'left' && gameState.playerLane > 0) gameState.playerLane--;
        else if (direction === 'right' && gameState.playerLane < 2) gameState.playerLane++;
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') movePlayer('left');
        if (e.key === 'ArrowRight') movePlayer('right');
    });

    canvas.addEventListener('mousedown', handleInput);
    canvas.addEventListener('touchstart', handleInput, {passive: false});

    function handleInput(e) {
        if (!gameState.isRunning) return;
        if (e.target.closest('#task-box')) return;
        if(e.type === 'touchstart') e.preventDefault();
        
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        if (clientX < window.innerWidth / 2) movePlayer('left');
        else movePlayer('right');
    }

    function startGame() {
        let initClouds = [];
        for(let i=0; i<3; i++) spawnCloud(); // 1. 减少初始云朵数量 (5 -> 3)

        gameState = {
            isRunning: true, score: 0, lives: 3,
            speed: GAME_SPEED_INITIAL, playerLane: 1,
            items: [], particles: [], coins: [], floatingTexts: [], fireworks: [],
            decorations: [], clouds: gameState.clouds.length ? gameState.clouds : initClouds,
            currentTask: null,
            questionsAnswered: 0, 
            currentStreak: 0,
            spawnCooldown: 0, history: [],
            frameCount: 0,
            usedIndices: new Set(),
            shake: 0 // 屏幕震动强度
        };
        
        // 1. 预先生成路边装饰，填满屏幕
        for(let y = 0; y < canvas.height; y += 150) {
             if (Math.random() > 0.3) spawnDecoration(y);
        }
        
        if (!gameState.clouds.length) {
             for(let i=0; i<3; i++) spawnCloud();
        }
        
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('score').innerText = '0';
        document.getElementById('progress').innerText = '0/' + TOTAL_QUESTIONS;
        
        if (audioCtx.state === 'suspended') audioCtx.resume();

        lastTime = performance.now();
        generateNewTask();
        requestAnimationFrame(gameLoop);
    }
    
    // 生成爆炸粒子
    function spawnExplosion(x, y, color) {
        for(let i=0; i<15; i++) {
            gameState.particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: color,
                size: Math.random() * 5 + 3
            });
        }
    }
    
    // 触发屏幕震动
    function triggerShake(intensity) {
        gameState.shake = intensity;
    }

    function gameOver(win) {
        gameState.isRunning = false;
        document.getElementById('hud').classList.add('hidden');
        
        const endScreen = document.getElementById('game-over-screen');
        endScreen.classList.remove('hidden');
        
        const title = document.getElementById('end-title');
        title.innerText = win ? "恭喜发财! 🧨" : "再接再厉! 💪";
        
        document.getElementById('final-score').innerText = `最终得分: ${gameState.score}`;
        
        const stars = document.getElementById('star-rating');
        if (gameState.score >= TOTAL_QUESTIONS * 100) stars.innerText = "⭐⭐⭐";
        else if (gameState.score >= TOTAL_QUESTIONS * 60) stars.innerText = "⭐⭐";
        else stars.innerText = "⭐";
        
        const list = document.getElementById('word-review-list');
        list.innerHTML = '';
        
        if (gameState.history.length === 0) list.innerHTML = '<li>无记录</li>';

        gameState.history.forEach(item => {
            const li = document.createElement('li');
            li.className = `word-item ${item.result === 'correct' ? 'correct' : 'wrong'}`;
            let icon = item.result === 'correct' ? '✅' : '❌';
            if(item.result === 'missed') icon = '💨';

            li.innerHTML = `
                <div>
                    <span style="font-weight:bold;">${item.word}</span>
                    <span style="font-size:0.9em; color:#666;"> - ${item.meaning}</span>
                </div>
                <div style="display:flex; align-items:center;">
                    <span>${icon}</span>
                    <button class="audio-btn" onclick="playWordAudio('${item.word}')">🔊</button>
                </div>
            `;
            list.appendChild(li);
        });
    }
</script>
</body>
</html>
