<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>单词闪电跑酷 (Word Dash) - 最终版</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+SC:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Noto Sans SC', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        /* 界面覆盖层 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            z-index: 10;
            transition: opacity 0.3s;
            backdrop-filter: blur(5px);
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            color: #FFD700;
            text-shadow: 4px 4px 0 #FF4500;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 2px;
        }

        .btn {
            background: linear-gradient(to bottom, #4CAF50, #2E7D32);
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Fredoka One', cursive;
            box-shadow: 0 6px 0 #1B5E20;
            transition: transform 0.1s, box-shadow 0.1s;
            margin: 10px;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1B5E20;
        }

        .btn-blue { background: linear-gradient(to bottom, #2196F3, #1565C0); box-shadow: 0 6px 0 #0D47A1; }

        /* HUD */
        #hud {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            padding: 0 15px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
        }

        .hud-item {
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 800;
            color: #333;
            font-size: 1.1rem;
            border: 3px solid #333;
            min-width: 80px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        #score-container {
            position: relative;
        }

        /* 结算面板 */
        #result-content {
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 25px;
            width: 90%;
            max-width: 450px;
            max-height: 70vh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .word-list {
            list-style: none;
            padding: 0;
            margin: 15px 0;
            text-align: left;
        }

        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 2px solid #f0f0f0;
            font-size: 1rem;
        }

        .word-item.wrong {
            background-color: #ffebee;
            color: #d32f2f;
            border-radius: 8px;
        }
        
        .word-item.correct {
            color: #2E7D32;
        }

        .audio-btn {
            background: #fff;
            border: 2px solid #ddd;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .controls-hint {
            margin-top: 20px; 
            font-size: 0.9rem; 
            color: #eee; 
            background: rgba(0,0,0,0.3); 
            padding: 5px 15px; 
            border-radius: 20px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- 开始界面 -->
    <div id="start-screen" class="overlay">
        <h1>⚡ 单词闪电跑酷 ⚡</h1>
        <p style="font-size: 1.2rem; margin-bottom: 5px; font-weight: bold; color: #FFEB3B;">Unit 1: Where do people live?</p>
        <p style="font-size: 0.9rem; margin-bottom: 30px; opacity: 0.8;">使用真人发音 (需联网)</p>
        
        <button class="btn" onclick="startGame()">开始挑战</button>
        
        <div class="controls-hint">
            ⌨️ 键盘 ← → 移动 &nbsp;|&nbsp; 👆 点击屏幕两侧移动
        </div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
        <div class="hud-item" style="color: #d32f2f;">❤️ <span id="lives">3</span></div>
        <div id="score-container" class="hud-item" style="color: #FF9800;">⭐ <span id="score">0</span></div>
        <div class="hud-item" style="color: #2196F3;">🎯 <span id="progress">0/15</span></div>
    </div>

    <!-- 结算界面 -->
    <div id="game-over-screen" class="overlay hidden">
        <h1 id="end-title">挑战结束!</h1>
        <div id="result-content">
            <h2 id="final-score" style="color:#333; margin-bottom:5px;">得分: 0</h2>
            <div id="star-rating" style="font-size: 1.5rem; margin-bottom: 15px;"></div>
            
            <h3 style="text-align: left; border-bottom: 2px solid #eee; padding-bottom: 5px; font-size:1rem;">本次单词回顾</h3>
            <ul id="word-review-list" class="word-list">
                <!-- 动态生成 -->
            </ul>
            <button class="btn btn-blue" onclick="startGame()">再玩一次</button>
        </div>
    </div>
</div>

<script>
    /**
     * 游戏配置
     */
    const AUDIO_BASE_URL = "https://dict.youdao.com/dictvoice?type=2&audio=";
    
    // 词库更新: 四年级上册全学期词汇 (Unit 1 - Unit 8)
    const VOCABULARY = [
        // Unit 1: Where do people live?
        { word: "city", meaning: "城市" },
        { word: "building", meaning: "建筑物" },
        { word: "flat", meaning: "公寓" },
        { word: "street", meaning: "街道" },
        { word: "country", meaning: "国家; 乡村" },
        { word: "farm", meaning: "农场" },
        { word: "house", meaning: "房子" },
        { word: "live", meaning: "居住" },
        
        // Unit 2: Where do animals live?
        { word: "eagle", meaning: "老鹰" },
        { word: "owl", meaning: "猫头鹰" },
        { word: "honeybee", meaning: "蜜蜂" },
        { word: "forest", meaning: "森林" },
        { word: "hole", meaning: "洞" },
        { word: "nest", meaning: "鸟巢" },
        
        // Unit 3: How do we use numbers?
        { word: "odd", meaning: "奇数的" },
        { word: "even", meaning: "偶数的" },
        { word: "plus", meaning: "加" },
        { word: "minus", meaning: "减" },
        { word: "equal", meaning: "等于" },
        { word: "number", meaning: "数字" },
        { word: "fifteen", meaning: "十五" },
        { word: "fifty", meaning: "五十" },

        // Unit 4: What do we buy?
        { word: "supermarket", meaning: "超市" },
        { word: "rice", meaning: "米饭" },
        { word: "bag", meaning: "袋子" },
        { word: "bottle", meaning: "瓶子" },
        { word: "juice", meaning: "果汁" },
        { word: "box", meaning: "盒子" },
        { word: "biscuit", meaning: "饼干" },

        // Unit 5: How are the seasons different?
        { word: "spring", meaning: "春天" },
        { word: "summer", meaning: "夏天" },
        { word: "autumn", meaning: "秋天" },
        { word: "winter", meaning: "冬天" },
        { word: "warm", meaning: "温暖的" },
        { word: "cool", meaning: "凉爽的" },
        { word: "cold", meaning: "冷的" },

        // Unit 6: What's amazing about plants?
        { word: "plant", meaning: "植物" },
        { word: "flower", meaning: "花" },
        { word: "fruit", meaning: "水果" },
        { word: "seed", meaning: "种子" },
        { word: "soil", meaning: "土壤" },
        { word: "leaf", meaning: "叶子" },
        { word: "grow", meaning: "生长" },

        // Unit 7: How do we keep safe on the road?
        { word: "traffic", meaning: "交通" },
        { word: "light", meaning: "灯" },
        { word: "wait", meaning: "等待" },
        { word: "stop", meaning: "停止" },
        { word: "cross", meaning: "穿过" },
        { word: "pavement", meaning: "人行道" },

        // Unit 8: What do our grandparents do?
        { word: "busy", meaning: "忙碌的" },
        { word: "cook", meaning: "做饭" },
        { word: "sweep", meaning: "扫" },
        { word: "floor", meaning: "地板" },
        { word: "wash", meaning: "洗" },
        { word: "dish", meaning: "盘子" }
    ];

    const GAME_SPEED_INITIAL = 1.3; 
    const SPEED_INCREMENT = 0.05;   
    // 修改规则：一局的题目数量 = 词库的总单词数 (50+)
    // 这样确保每个单词都有机会出现至少一次
    const TOTAL_QUESTIONS = VOCABULARY.length;

    const BUBBLE_COLORS = ['#FF9800', '#2196F3', '#9C27B0', '#009688', '#E91E63', '#3F51B5'];

    function getRandomColor() {
        return BUBBLE_COLORS[Math.floor(Math.random() * BUBBLE_COLORS.length)];
    }

    /**
     * 游戏状态
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let gameState = {
        isRunning: false,
        score: 0,
        lives: 3,
        speed: GAME_SPEED_INITIAL,
        playerLane: 1, 
        items: [],     
        particles: [], 
        fireworks: [], // 烟花数组
        coins: [], 
        floatingTexts: [], 
        decorations: [], 
        clouds: [],      
        currentTask: null, 
        questionsAnswered: 0,
        currentStreak: 0, // 连对计数
        spawnCooldown: 0,
        history: [],
        frameCount: 0
    };

    let lastTime = 0;
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    /**
     * 音效系统
     */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'coin') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1800, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'firework') {
            // 烟花爆炸声 (简单的噪声模拟)
            const bufferSize = audioCtx.sampleRate * 0.5; // 0.5秒
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            noise.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start();
        }
    }

    function playWordAudio(word) {
        const audio = new Audio(AUDIO_BASE_URL + encodeURIComponent(word));
        audio.play().catch(e => console.warn("Audio fail:", e));
    }

    /**
     * 核心逻辑
     */
    function generateNewTask() {
        if (gameState.questionsAnswered >= TOTAL_QUESTIONS) {
            gameOver(true);
            return;
        }

        // 确保不连续出现完全相同的词（简单检查）
        // 如果题目还没出完，尽量不重复出题
        let availableIndices = [];
        if (!gameState.usedIndices) gameState.usedIndices = new Set();
        
        // 找出还没出过的单词索引
        for(let i=0; i<VOCABULARY.length; i++) {
            if(!gameState.usedIndices.has(i)) availableIndices.push(i);
        }
        
        let targetIndex;
        // 如果还有没出过的词，优先从里面选
        if (availableIndices.length > 0) {
            const randomIndex = Math.floor(Math.random() * availableIndices.length);
            targetIndex = availableIndices[randomIndex];
            gameState.usedIndices.add(targetIndex);
        } else {
            // 如果全出完了（理论上 TOTAL_QUESTIONS = length 不会走到这，除非逻辑修改）
            // 就随机选一个作为兜底
            targetIndex = Math.floor(Math.random() * VOCABULARY.length);
        }

        const targetWord = VOCABULARY[targetIndex];
        const mode = Math.random() > 0.5 ? 'CN_to_EN' : 'EN_to_CN';
        
        gameState.currentTask = {
            ...targetWord,
            mode: mode,
            processing: false
        };

        spawnItemRow(targetWord, mode);
    }

    function spawnItemRow(targetWord, mode) {
        const laneIndices = [0, 1, 2].sort(() => Math.random() - 0.5);
        const startY = -300; 
        
        const isTargetEnglish = (mode === 'CN_to_EN'); 
        
        gameState.items.push({
            type: 'word',
            displayText: isTargetEnglish ? targetWord.word : targetWord.meaning, 
            word: targetWord.word, 
            isTarget: true,
            lane: laneIndices[0],
            y: startY,
            color: getRandomColor()
        });

        let wrong1 = getDistractor(targetWord);
        gameState.items.push({
            type: 'word',
            displayText: isTargetEnglish ? wrong1.word : wrong1.meaning,
            word: wrong1.word,
            isTarget: false,
            lane: laneIndices[1],
            y: startY,
            color: getRandomColor()
        });

        let wrong2 = getDistractor(targetWord, wrong1);
        gameState.items.push({
            type: 'word',
            displayText: isTargetEnglish ? wrong2.word : wrong2.meaning,
            word: wrong2.word,
            isTarget: false,
            lane: laneIndices[2],
            y: startY,
            color: getRandomColor()
        });
    }

    function getDistractor(target, exclude = null) {
        let distractor;
        let attempts = 0;
        do {
            distractor = VOCABULARY[Math.floor(Math.random() * VOCABULARY.length)];
            attempts++;
        } while ((distractor.word === target.word || (exclude && distractor.word === exclude.word)) && attempts < 20);
        return distractor;
    }

    function spawnDecoration() {
        const side = Math.random() > 0.5 ? 'left' : 'right';
        const laneWidth = canvas.width / 4;
        const centerX = canvas.width / 2;
        
        let x;
        if (side === 'left') {
            x = Math.random() * (centerX - laneWidth * 1.6);
        } else {
            x = (centerX + laneWidth * 1.6) + Math.random() * (centerX - laneWidth * 1.6);
        }

        gameState.decorations.push({
            x: x,
            y: -100,
            type: Math.random() > 0.7 ? 'tree' : 'bush',
            scale: 0.8 + Math.random() * 0.4,
            color: Math.random() > 0.5 ? '#4CAF50' : '#66BB6A'
        });
    }

    function spawnCloud() {
        gameState.clouds.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height * 0.4,
            size: 30 + Math.random() * 40,
            speed: 0.2 + Math.random() * 0.5
        });
    }

    // 烟花粒子系统
    function spawnFirework(x, y) {
        playBeep('firework');
        // 核心爆炸点
        for (let i = 0; i < 80; i++) {
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 6 + 2;
            const color = `hsl(${Math.random() * 360}, 100%, 60%)`;
            
            gameState.fireworks.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * velocity,
                vy: Math.sin(angle) * velocity,
                color: color,
                alpha: 1,
                life: 1.0,
                decay: Math.random() * 0.015 + 0.01,
                gravity: 0.1
            });
        }
    }

    function updateFireworks() {
        for (let i = gameState.fireworks.length - 1; i >= 0; i--) {
            let p = gameState.fireworks[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.life -= p.decay;
            p.alpha = p.life;
            
            // 阻力
            p.vx *= 0.95;
            p.vy *= 0.95;

            if (p.life <= 0) {
                gameState.fireworks.splice(i, 1);
            }
        }
    }

    function drawFireworks() {
        // 叠加模式让烟花更亮
        ctx.globalCompositeOperation = 'lighter';
        gameState.fireworks.forEach(p => {
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
        ctx.globalCompositeOperation = 'source-over';
    }

    function gameLoop(timestamp) {
        if (!gameState.isRunning) return;

        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;

        update(deltaTime);
        draw();

        requestAnimationFrame(gameLoop);
    }

    function update(deltaTime) {
        gameState.frameCount++;
        gameState.speed = GAME_SPEED_INITIAL + (gameState.questionsAnswered * SPEED_INCREMENT);

        if (gameState.frameCount % 60 === 0) spawnDecoration();
        for (let i = gameState.decorations.length - 1; i >= 0; i--) {
            let d = gameState.decorations[i];
            d.y += gameState.speed; 
            if (d.y > canvas.height + 100) gameState.decorations.splice(i, 1);
        }

        gameState.clouds.forEach(c => {
            c.x += c.speed;
            if (c.x > canvas.width + 100) c.x = -100;
        });

        for (let i = gameState.items.length - 1; i >= 0; i--) {
            let item = gameState.items[i];
            item.y += gameState.speed;

            if (!item.hit && checkCollision(item)) {
                handleCollision(item);
                item.hit = true;
                gameState.items.splice(i, 1);
                continue;
            }

            if (item.y > canvas.height + 100) {
                gameState.items.splice(i, 1);
                if (item.isTarget) {
                    handleWrong("missed");
                }
            }
        }

        const targetX = canvas.width / 2;
        const targetY = 40; 
        for (let i = gameState.coins.length - 1; i >= 0; i--) {
            let c = gameState.coins[i];
            c.x += (targetX - c.x) * 0.1;
            c.y += (targetY - c.y) * 0.1;
            
            if (Math.abs(c.y - targetY) < 10) {
                gameState.score += 100;
                playBeep('coin');
                document.getElementById('score').innerText = gameState.score;
                gameState.coins.splice(i, 1);
            }
        }

        for (let i = gameState.floatingTexts.length - 1; i >= 0; i--) {
            let ft = gameState.floatingTexts[i];
            ft.y -= 2;
            ft.life -= 0.02;
            if (ft.life <= 0) gameState.floatingTexts.splice(i, 1);
        }

        updateParticles();
        updateFireworks();

        if (gameState.currentTask) {
             if (gameState.currentTask.processing) {
                 if (gameState.spawnCooldown > 0) {
                     gameState.spawnCooldown--;
                 } else {
                     generateNewTask();
                 }
             }
        } else {
            generateNewTask();
        }
    }

    function checkCollision(item) {
        const playerY = canvas.height - 180; 
        const hitRangeY = 70; 
        
        if (item.lane !== gameState.playerLane) return false;
        if (Math.abs(item.y - playerY) < hitRangeY) return true;
        
        return false;
    }

    function handleCollision(item) {
        if (item.type === 'word') {
            playWordAudio(item.word);
            
            if (item.isTarget) {
                handleCorrect(item.lane, canvas.height - 180);
                createParticles(item.lane, canvas.height - 150, '#FFD700');
            } else {
                handleWrong("wrong", item.lane, canvas.height - 180);
                createParticles(item.lane, canvas.height - 150, '#F44336');
            }
        }
    }

    function handleCorrect(lane, y) {
        const startX = getLaneX(gameState.playerLane);
        gameState.coins.push({ x: startX, y: y });
        
        playBeep('correct');
        
        gameState.questionsAnswered++;
        gameState.currentStreak++; // 连对计数增加
        
        document.getElementById('progress').innerText = `${gameState.questionsAnswered}/${TOTAL_QUESTIONS}`;

        gameState.history.push({
            word: gameState.currentTask.word, 
            meaning: gameState.currentTask.meaning, 
            result: 'correct'
        });
        
        // 3. 连续答对3次，触发烟花
        if (gameState.currentStreak > 0 && gameState.currentStreak % 3 === 0) {
            // 在屏幕中心和随机位置放多个烟花
            spawnFirework(canvas.width / 2, canvas.height / 3);
            setTimeout(() => spawnFirework(canvas.width / 3, canvas.height / 4), 200);
            setTimeout(() => spawnFirework(canvas.width * 2 / 3, canvas.height / 4), 400);
            
            gameState.floatingTexts.push({
                x: canvas.width / 2,
                y: canvas.height / 2,
                text: "Combo! 🔥",
                color: "#FFD700",
                life: 3.0, // 停留久一点
                size: 60
            });
        }
        
        finishCurrentTask(60); 
    }

    function handleWrong(type, lane, y) {
        loseLife();
        playBeep('wrong'); 
        gameState.currentStreak = 0; // 答错重置连击
        
        if (lane !== undefined) {
            gameState.floatingTexts.push({
                x: getLaneX(lane),
                y: y,
                text: "❌",
                color: "red",
                life: 1.0,
                size: 60
            });
        }

        gameState.history.push({
            word: gameState.currentTask.word, 
            meaning: gameState.currentTask.meaning, 
            result: type
        });
        
        gameState.questionsAnswered++;
        document.getElementById('progress').innerText = `${gameState.questionsAnswered}/${TOTAL_QUESTIONS}`;
        finishCurrentTask(60);
    }
    
    function finishCurrentTask(cooldown) {
        if (gameState.currentTask) gameState.currentTask.processing = true;
        gameState.spawnCooldown = cooldown;
    }

    function loseLife() {
        gameState.lives--;
        document.getElementById('lives').innerText = gameState.lives;
        
        const flash = document.createElement('div');
        flash.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;background:red;opacity:0.3;z-index:9;pointer-events:none;transition:opacity 0.2s;';
        document.body.appendChild(flash);
        setTimeout(() => flash.style.opacity = 0, 100);
        setTimeout(() => flash.remove(), 300);

        if (gameState.lives <= 0) {
            setTimeout(() => gameOver(false), 500);
        }
    }

    /**
     * 绘图
     */
    function draw() {
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#4FC3F7'); 
        gradient.addColorStop(1, '#E1F5FE');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawClouds();
        drawRoad();
        drawDecorations();

        gameState.items.forEach(drawItem);
        drawPlayer();
        drawCoins();
        drawFloatingTexts();
        drawParticles();
        drawFireworks(); // 绘制烟花

        // Vignette (暗角)
        const rad = canvas.width * 0.8;
        const vig = ctx.createRadialGradient(canvas.width/2, canvas.height/2, rad * 0.4, canvas.width/2, canvas.height/2, rad);
        vig.addColorStop(0, 'rgba(0,0,0,0)');
        vig.addColorStop(1, 'rgba(0,0,0,0.15)');
        ctx.fillStyle = vig;
        ctx.fillRect(0,0,canvas.width,canvas.height);
    }

    function getLaneX(laneIndex) {
        const laneWidth = canvas.width / 4;
        const centerX = canvas.width / 2;
        if (laneIndex === 0) return centerX - laneWidth;
        if (laneIndex === 1) return centerX;
        if (laneIndex === 2) return centerX + laneWidth;
        return centerX;
    }

    function drawClouds() {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        gameState.clouds.forEach(c => {
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
            ctx.arc(c.x + c.size * 0.8, c.y + c.size * 0.3, c.size * 0.7, 0, Math.PI * 2);
            ctx.arc(c.x - c.size * 0.8, c.y + c.size * 0.3, c.size * 0.7, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function drawRoad() {
        const laneWidth = canvas.width / 4;
        const centerX = canvas.width / 2;
        const roadLeft = centerX - laneWidth * 1.5;
        const roadRight = centerX + laneWidth * 1.5;
        
        ctx.fillStyle = '#81C784';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#795548';
        ctx.fillRect(roadLeft, 0, roadRight - roadLeft, canvas.height);
        
        ctx.fillStyle = 'rgba(0,0,0,0.05)';
        for(let i=0; i<10; i++) { }
        
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 5;
        ctx.setLineDash([40, 40]); 
        
        ctx.beginPath();
        ctx.moveTo(centerX - laneWidth/2, 0);
        ctx.lineTo(centerX - laneWidth/2, canvas.height);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(centerX + laneWidth/2, 0);
        ctx.lineTo(centerX + laneWidth/2, canvas.height);
        ctx.stroke();
        
        ctx.setLineDash([]); 
        
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(roadLeft + 5, 0);
        ctx.lineTo(roadLeft + 5, canvas.height);
        ctx.moveTo(roadRight - 5, 0);
        ctx.lineTo(roadRight - 5, canvas.height);
        ctx.stroke();
    }

    function drawDecorations() {
        gameState.decorations.forEach(d => {
            const cx = d.x;
            const cy = d.y;
            const s = d.scale;

            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 20*s, 30*s, 10*s, 0, 0, Math.PI*2);
            ctx.fill();

            if (d.type === 'tree') {
                ctx.fillStyle = '#5D4037';
                ctx.fillRect(cx - 10*s, cy - 60*s, 20*s, 80*s);
                ctx.fillStyle = d.color;
                ctx.beginPath();
                ctx.arc(cx, cy - 80*s, 40*s, 0, Math.PI*2);
                ctx.arc(cx - 30*s, cy - 60*s, 30*s, 0, Math.PI*2);
                ctx.arc(cx + 30*s, cy - 60*s, 30*s, 0, Math.PI*2);
                ctx.fill();
            } else {
                ctx.fillStyle = d.color;
                ctx.beginPath();
                ctx.arc(cx, cy, 25*s, 0, Math.PI*2);
                ctx.arc(cx - 20*s, cy + 10*s, 20*s, 0, Math.PI*2);
                ctx.arc(cx + 20*s, cy + 10*s, 20*s, 0, Math.PI*2);
                ctx.fill();
            }
        });
    }

    function drawPlayer() {
        const x = getLaneX(gameState.playerLane);
        const y = canvas.height - 180;
        const bounce = Math.sin(Date.now() / 150) * 5;

        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(x, y + 45, 28 + bounce * 0.5, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#FF9800'; 
        ctx.beginPath();
        ctx.arc(x, y - 20 + bounce, 25, Math.PI, 0); 
        ctx.fillRect(x - 25, y - 20 + bounce, 50, 50); 
        ctx.arc(x, y + 30 + bounce, 25, 0, Math.PI); 
        ctx.fill();
        
        ctx.fillStyle = '#E53935';
        ctx.beginPath();
        ctx.moveTo(x - 12, y - 10 + bounce);
        ctx.lineTo(x + 12, y - 10 + bounce);
        ctx.lineTo(x, y + 15 + bounce);
        ctx.fill();

        const blink = Math.sin(Date.now() / 1000) > 0.95; 
        
        if (blink) {
             ctx.strokeStyle = '#333';
             ctx.lineWidth = 2;
             ctx.beginPath();
             ctx.moveTo(x - 14, y - 15 + bounce);
             ctx.lineTo(x - 6, y - 15 + bounce);
             ctx.moveTo(x + 6, y - 15 + bounce);
             ctx.lineTo(x + 14, y - 15 + bounce);
             ctx.stroke();
        } else {
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(x - 10, y - 15 + bounce, 8, 0, Math.PI * 2);
            ctx.arc(x + 10, y - 15 + bounce, 8, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(x - 10, y - 15 + bounce, 3, 0, Math.PI * 2);
            ctx.arc(x + 10, y - 15 + bounce, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        if (gameState.currentTask && !gameState.currentTask.processing) {
            const bubbleY = y - 90 + bounce;
            
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath();
            ctx.ellipse(x + 5, bubbleY + 5, 80, 40, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.ellipse(x, bubbleY, 80, 40, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x, bubbleY + 40);
            ctx.lineTo(x - 10, bubbleY + 30);
            ctx.lineTo(x + 10, bubbleY + 30);
            ctx.fill();
            
            ctx.fillStyle = '#333';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const text = gameState.currentTask.mode === 'CN_to_EN' 
                ? gameState.currentTask.meaning 
                : gameState.currentTask.word;   
            
            if (/[a-zA-Z]/.test(text)) {
                ctx.font = 'bold 22px "Fredoka One"';
            } else {
                ctx.font = 'bold 24px "Noto Sans SC"';
            }
            ctx.fillText(text, x, bubbleY);
            
            ctx.font = '10px "Noto Sans SC"';
            ctx.fillStyle = '#888';
            ctx.fillText("找对应的?", x, bubbleY + 28);
        }
    }

    function drawItem(item) {
        const x = getLaneX(item.lane);
        
        if (item.type === 'word') {
            // 扁平化风格 (Flat Design)
            ctx.fillStyle = item.color;
            
            // 简单的圆形阴影 (底部偏移)
            ctx.shadowColor = 'rgba(0,0,0,0.15)';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 6;
            
            ctx.beginPath();
            ctx.arc(x, item.y, 45, 0, Math.PI * 2); 
            ctx.fill();
            
            ctx.shadowOffsetY = 0; // 重置
            
            // 内部微弱渐变，增加一点体积感但不反光
            const grad = ctx.createLinearGradient(x, item.y - 45, x, item.y + 45);
            grad.addColorStop(0, 'rgba(255,255,255,0.2)');
            grad.addColorStop(1, 'rgba(0,0,0,0.1)');
            ctx.fillStyle = grad;
            ctx.fill();

            // 白色粗边框
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 6;
            ctx.stroke();

            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // 文字轻微阴影，增加可读性
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 2;
            
            if (/[a-zA-Z]/.test(item.displayText)) {
                ctx.font = 'bold 24px "Fredoka One"';
            } else {
                ctx.font = 'bold 26px "Noto Sans SC"';
            }
            ctx.fillText(item.displayText, x, item.y);
            
            ctx.shadowBlur = 0;
        }
    }

    function adjustColor(color, amount) {
        return color; 
    }

    function drawCoins() {
        gameState.coins.forEach(c => {
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(c.x, c.y, 16, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#FFA000';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#FFF';
            ctx.font = 'bold 16px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('$', c.x, c.y);
        });
    }

    function drawFloatingTexts() {
        gameState.floatingTexts.forEach(ft => {
            ctx.globalAlpha = ft.life;
            ctx.fillStyle = ft.color;
            ctx.font = `bold ${ft.size}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'white';
            ctx.shadowBlur = 5;
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.shadowBlur = 0;
        });
        ctx.globalAlpha = 1.0;
    }

    function createParticles(lane, y, color) {
        const x = getLaneX(lane);
        for(let i=0; i<15; i++) {
            gameState.particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 15,
                vy: (Math.random() - 0.5) * 15,
                life: 1.0, color: color
            });
        }
    }

    function updateParticles() {
        for(let i=gameState.particles.length-1; i>=0; i--) {
            let p = gameState.particles[i];
            p.x += p.vx; p.y += p.vy;
            p.life -= 0.05;
            if(p.life <= 0) gameState.particles.splice(i, 1);
        }
    }

    function drawParticles() {
        gameState.particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5 + Math.random()*3, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }

    // 控制
    function movePlayer(direction) {
        if (!gameState.isRunning) return;
        if (direction === 'left' && gameState.playerLane > 0) gameState.playerLane--;
        else if (direction === 'right' && gameState.playerLane < 2) gameState.playerLane++;
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') movePlayer('left');
        if (e.key === 'ArrowRight') movePlayer('right');
    });

    canvas.addEventListener('mousedown', handleInput);
    canvas.addEventListener('touchstart', handleInput, {passive: false});

    function handleInput(e) {
        if (!gameState.isRunning) return;
        if (e.target.closest('#task-box')) return;
        if(e.type === 'touchstart') e.preventDefault();
        
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        if (clientX < window.innerWidth / 2) movePlayer('left');
        else movePlayer('right');
    }

    function startGame() {
        let initClouds = [];
        for(let i=0; i<5; i++) spawnCloud();

        gameState = {
            isRunning: true, score: 0, lives: 3,
            speed: GAME_SPEED_INITIAL, playerLane: 1,
            items: [], particles: [], coins: [], floatingTexts: [], fireworks: [],
            decorations: [], clouds: gameState.clouds.length ? gameState.clouds : initClouds,
            currentTask: null,
            questionsAnswered: 0, 
            currentStreak: 0,
            spawnCooldown: 0, history: [],
            frameCount: 0,
            usedIndices: new Set() // 新增：记录已出过的题目索引
        };
        
        if (!gameState.clouds.length) {
             for(let i=0; i<5; i++) spawnCloud();
        }
        
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('score').innerText = '0';
        document.getElementById('progress').innerText = '0/' + TOTAL_QUESTIONS;
        
        if (audioCtx.state === 'suspended') audioCtx.resume();

        lastTime = performance.now();
        generateNewTask();
        requestAnimationFrame(gameLoop);
    }

    function gameOver(win) {
        gameState.isRunning = false;
        document.getElementById('hud').classList.add('hidden');
        
        const endScreen = document.getElementById('game-over-screen');
        endScreen.classList.remove('hidden');
        
        const title = document.getElementById('end-title');
        title.innerText = win ? "挑战成功! 🎉" : "再接再厉! 💪";
        
        document.getElementById('final-score').innerText = `最终得分: ${gameState.score}`;
        
        const stars = document.getElementById('star-rating');
        if (gameState.score >= TOTAL_QUESTIONS * 100) stars.innerText = "⭐⭐⭐";
        else if (gameState.score >= TOTAL_QUESTIONS * 60) stars.innerText = "⭐⭐";
        else stars.innerText = "⭐";
        
        const list = document.getElementById('word-review-list');
        list.innerHTML = '';
        
        if (gameState.history.length === 0) list.innerHTML = '<li>无记录</li>';

        gameState.history.forEach(item => {
            const li = document.createElement('li');
            li.className = `word-item ${item.result === 'correct' ? 'correct' : 'wrong'}`;
            let icon = item.result === 'correct' ? '✅' : '❌';
            if(item.result === 'missed') icon = '💨';

            li.innerHTML = `
                <div>
                    <span style="font-weight:bold;">${item.word}</span>
                    <span style="font-size:0.9em; color:#666;"> - ${item.meaning}</span>
                </div>
                <div style="display:flex; align-items:center;">
                    <span>${icon}</span>
                    <button class="audio-btn" onclick="playWordAudio('${item.word}')">🔊</button>
                </div>
            `;
            list.appendChild(li);
        });
    }
</script>
