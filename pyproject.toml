[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-batch-processor"
version = "0.1.0"
description = "CLI tool for batch file operations (rename, delete, convert)"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "Pillow>=10.0.0",
]

[project.scripts]
fileproc = "src.cli.commands:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools]
packages = ["src.cli", "src.core", "src.utils"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]

