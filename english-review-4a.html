<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四年级(上) 全科期末总复习</title>
    <!-- Markmap -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4/dist/browser/index.min.js"></script>
    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #4a90e2; /* Default (English) */
            --math-color: #27ae60;
            --chi-color: #c0392b;
            --secondary-color: #f5a623;
            --success-color: #7ed321;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
        }
        
        /* --- GAME STYLES --- */
        .game-container {
            background: white; border-radius: 20px; padding: 30px;
            text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            max-width: 800px; margin: 0 auto;
        }
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: #7f8c8d; }
        .game-score { font-size: 1.5em; font-weight: bold; color: var(--secondary-color); }
        
        .q-display { 
            font-size: 2.2em; font-weight: bold; color: #2c3e50; margin: 30px 0;
            padding: 20px; background: #f9f9f9; border-radius: 15px; border: 2px dashed #ddd;
        }
        
        .pv-chart { 
            display: flex; justify-content: center; gap: 4px; margin-bottom: 30px; flex-wrap: wrap;
        }
        .pv-group { display: flex; gap: 4px; margin: 0 5px; padding: 5px; border-radius: 8px; background: #f0f4f8; }
        .pv-box { display: flex; flex-direction: column; align-items: center; }
        .pv-label { font-size: 0.8em; color: #7f8c8d; margin-bottom: 5px; }
        .pv-input { 
            width: 45px; height: 55px; font-size: 1.8em; text-align: center; 
            border: 2px solid #bdc3c7; border-radius: 8px; color: #2c3e50; font-weight: bold;
            transition: all 0.2s;
        }
        .pv-input:focus { border-color: var(--math-color); outline: none; transform: scale(1.1); box-shadow: 0 4px 10px rgba(39, 174, 96, 0.2); }
        .pv-input.correct { border-color: var(--success-color); background: #e8f8f5; color: var(--success-color); }
        .pv-input.wrong { border-color: #e74c3c; background: #fdedec; animation: shake 0.3s; }
        
        .check-btn {
            padding: 12px 40px; font-size: 1.3em; background: var(--math-color); color: white;
            border: none; border-radius: 50px; cursor: pointer; transition: transform 0.2s;
            box-shadow: 0 4px 0 #1e8449;
        }
        .check-btn:active { transform: translateY(4px); box-shadow: none; }
        .check-btn:hover { filter: brightness(1.1); }

        /* --- GAME U2: Angle Detective --- */
        .u2-canvas-container { 
            position: relative; width: 300px; height: 300px; margin: 0 auto 20px; 
            background: #fff; border-radius: 50%; border: 10px solid #ecf0f1;
            display: flex; align-items: center; justify-content: center;
        }
        #u2-canvas { width: 100%; height: 100%; border-radius: 50%; }
        .u2-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .u2-btn {
            padding: 10px 20px; border: 2px solid var(--math-color); background: white;
            color: var(--math-color); border-radius: 30px; cursor: pointer; font-weight: bold;
            font-size: 1.1em; transition: all 0.2s; flex: 1 1 40%;
        }
        .u2-btn:hover { background: var(--math-color); color: white; }
        .u2-btn.correct { background: var(--success-color); border-color: var(--success-color); color: white; }
        .u2-btn.wrong { background: #e74c3c; border-color: #e74c3c; color: white; }

        /* --- GAME U3: Space Math --- */
        #u3-game-area {
            position: relative; width: 100%; height: 400px; background: #2c3e50;
            border-radius: 15px; overflow: hidden; color: white; margin-bottom: 20px;
        }
        .meteor {
            position: absolute; width: 100px; height: 100px; 
            background: radial-gradient(circle, #95a5a6 0%, #7f8c8d 100%);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.2em; box-shadow: inset -10px -10px 20px rgba(0,0,0,0.5);
            transition: top 0.1s linear, transform 0.1s; z-index: 10;
        }
        .meteor.boom { transform: scale(1.5); opacity: 0; background: orange; }
        .laser-beam {
            position: absolute; width: 4px; background: #e74c3c; bottom: 0; 
            transform-origin: bottom center; z-index: 5;
        }
        .u3-controls { display: flex; gap: 10px; justify-content: center; }
        #u3-input { 
            font-size: 1.5em; padding: 10px; width: 150px; text-align: center; 
            border-radius: 10px; border: none; outline: 2px solid var(--math-color);
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            padding-top: 60px; /* Space for progress bar & subject switch */
            color: #333;
            transition: background-color 0.3s;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Subject Switcher */
        .subject-switcher {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            background: white;
            padding: 10px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .subj-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            background: transparent;
            color: #888;
            transition: all 0.2s;
        }

        .subj-btn:hover { background: #f5f5f5; }
        
        .subj-btn.active {
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transform: scale(1.05);
        }

        .subj-btn.active[data-subj="english"] { background: var(--primary-color); }
        .subj-btn.active[data-subj="math"] { background: var(--math-color); }
        .subj-btn.active[data-subj="chinese"] { background: var(--chi-color); }

        /* View Containers */
        .subject-view { display: none; animation: fadeIn 0.3s; }
        .subject-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Header (Dynamic) */
        header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: background 0.5s;
        }
        
        header.math-theme { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        header.chi-theme { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); color: #d32f2f; }
        header.chi-theme h1, header.chi-theme .subtitle { color: #c0392b; text-shadow: none; }

        h1 { margin: 0; font-size: 2.5em; }
        .subtitle { opacity: 0.9; margin-top: 10px; font-size: 1.2em; }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            background: white;
            color: #555;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .nav-btn.active {
            background: var(--primary-color); /* Overridden by JS for other subjects */
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Content Sections */
        .section { display: none; }
        .section.active { display: block; }

        /* Mind Map */
        .mindmap-container {
            width: 100%; height: 60vh; min-height: 500px;
            background: white; border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            overflow: hidden; border: 2px solid #e1e8ed;
            position: relative;
        }
        svg.markmap { width: 100%; height: 100%; }

        /* Grids & Cards */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 5px solid var(--primary-color); /* Overridden by JS */
        }

        .card h3 {
            margin-top: 0; color: #2c3e50; border-bottom: 2px solid #eee;
            padding-bottom: 10px; display: flex; align-items: center; gap: 10px;
        }

        /* Check Items */
        .check-item {
            display: flex; align-items: center; margin-bottom: 12px;
            cursor: pointer; padding: 10px 15px; border-radius: 10px;
            transition: transform 0.2s; font-size: 1.2em;
        }
        .check-item:hover { transform: scale(1.02); }
        .check-item input { margin-right: 15px; transform: scale(1.5); accent-color: var(--success-color); }
        .check-item span { flex: 1; }
        .cn-hint { color: #666; font-size: 0.9em; margin-left: 10px; }
        .highlight { color: #d32f2f; font-weight: bold; }

        /* Tooltip (English Only) */
        .word-trigger { border-bottom: 1px dashed #aaa; cursor: help; transition: color 0.2s; }
        .word-trigger:hover { color: var(--primary-color); border-bottom-style: solid; }

        #vocab-tooltip {
            position: absolute; background: white; color: #333; padding: 15px;
            border-radius: 8px; font-size: 14px; z-index: 1000; width: 300px;
            pointer-events: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border: 1px solid #eee; opacity: 0; transition: opacity 0.2s; display: none;
        }
        #vocab-tooltip.visible { opacity: 1; display: block; }
        
        .tt-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .tt-word { font-size: 1.3em; font-weight: bold; color: var(--primary-color); }
        .tt-phonetic { color: #888; font-family: sans-serif; }
        .tt-speaker, .tt-star { cursor: pointer; margin-left: 5px; font-size: 1.2em; }
        .tt-star.active { color: orange; }

        /* Progress Bar */
        #progress-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 8px;
            background: #f0f0f0; z-index: 2000;
        }
        #progress-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #ff9a9e 0%, #fad0c4 100%);
            transition: width 0.4s ease;
        }

        /* Flashcard Overlay */
        #flashcard-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.95); z-index: 5000;
            display: none; justify-content: center; align-items: center;
        }
        .fc-container { width: 90%; max-width: 600px; position: relative; perspective: 1000px; }
        .fc-close { position: absolute; top: -40px; right: 0; color: white; background: none; border: none; font-size: 30px; cursor: pointer; }
        .fc-card {
            width: 100%; height: 400px; background: white; border-radius: 20px;
            position: relative; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer;
        }
        .fc-card.flipped { transform: rotateY(180deg); }
        .fc-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-radius: 20px; padding: 20px; box-sizing: border-box; text-align: center;
        }
        .fc-front { background: white; z-index: 2; }
        .fc-back { background: #fdfdfd; transform: rotateY(180deg); border: 2px solid #eee; }
        .fc-word { font-size: 3em; font-weight: bold; color: #333; }
        .fc-mean { font-size: 1.5em; color: var(--primary-color); margin-bottom: 10px; }
        .fc-actions { display: flex; gap: 20px; margin-top: 20px; }
        .fc-btn { flex: 1; padding: 15px; border-radius: 10px; border: none; background: rgba(255,255,255,0.2); color: white; cursor: pointer; font-size: 1.1em; }
        .fc-btn:hover { background: rgba(255,255,255,0.3); }

        /* Poem Line Interaction */
        .poem-line { padding: 5px; cursor: pointer; border-radius: 5px; }
        .poem-line:hover { background: rgba(0,0,0,0.05); }
        .hidden-char { background: #555; color: transparent; border-radius: 3px; }

    </style>
</head>
<body>

<div id="progress-container"><div id="progress-bar"></div></div>

<div class="container">
    
    <!-- Subject Switcher -->
    <div class="subject-switcher">
        <button class="subj-btn active" data-subj="english" onclick="switchSubject('english')">🇺🇸 英语</button>
        <button class="subj-btn" data-subj="math" onclick="switchSubject('math')">📐 数学</button>
        <button class="subj-btn" data-subj="chinese" onclick="switchSubject('chinese')">🇨🇳 语文</button>
    </div>

    <!-- HEADER (Dynamic content) -->
    <header id="main-header">
        <h1 id="header-title">英语4A 期末复习</h1>
        <div class="subtitle" id="header-subtitle">Shanghai Education Press</div>
    </header>

    <!-- ENGLISH VIEW -->
    <div id="view-english" class="subject-view active">
        <nav class="nav-tabs">
            <button class="nav-btn active" onclick="switchTab('mindmap')">🧠 思维导图</button>
            <button class="nav-btn" onclick="switchTab('words')">📚 核心生词</button>
            <button class="nav-btn" onclick="switchTab('grammar')">⚙️ 语法句型</button>
            <button class="nav-btn" onclick="switchTab('my-words')" style="color: #e67e22;">📕 生词本</button>
            <button class="nav-btn" onclick="openFlashcardMode()" style="color: #9b59b6;">🃏 翻卡模式</button>
        </nav>

        <div id="mindmap" class="section active">
            <div class="mindmap-container"><svg id="mm-eng"></svg></div>
        </div>

        <div id="words" class="section">
            <div class="grid-container" id="eng-words-container">
                <!-- Will be populated by JS to preserve original structure -->
            </div>
        </div>

        <div id="grammar" class="section">
            <div class="grid-container" id="eng-grammar-container"></div>
        </div>

        <div id="sentences" class="section">
            <div class="grid-container" id="eng-sentences-container"></div>
        </div>

        <div id="my-words" class="section">
            <div id="my-words-container" class="grid-container"></div>
            <div id="empty-state" style="text-align: center; padding: 50px; display: none;">
                <h3>生词本是空的！</h3>
                <p>点击单词上的星星 ⭐ 加入。</p>
            </div>
        </div>
    </div>

    <!-- MATH VIEW -->
    <div id="view-math" class="subject-view">
        <nav class="nav-tabs">
            <button class="nav-btn active" onclick="switchTab('math-mindmap')">🧠 知识导图</button>
            <button class="nav-btn" onclick="switchTab('math-concepts')">📐 概念与易错</button>
            <button class="nav-btn" onclick="switchTab('math-game-u1')" style="color: #e67e22;">🎮 数字拼拼乐</button>
            <button class="nav-btn" onclick="switchTab('math-game-u2')" style="color: #8e44ad;">🕵️‍♀️ 角度侦探</button>
            <button class="nav-btn" onclick="switchTab('math-game-u3')" style="color: #2980b9;">🚀 太空计算</button>
            <button class="nav-btn" onclick="openFlashcardMode()" style="color: #9b59b6;">⚡ 易错判断 (翻卡)</button>
        </nav>
        <div id="math-mindmap" class="section active">
            <div class="mindmap-container"><svg id="mm-math"></svg></div>
        </div>
        <div id="math-concepts" class="section">
            <div class="grid-container" id="math-list-container"></div>
        </div>
        
        <!-- GAME U1 Container -->
        <div id="math-game-u1" class="section">
            <div class="game-container">
                <div class="game-header">
                    <span>第一单元：认识更大的数</span>
                    <div class="game-score">⭐ 得分: <span id="u1-score">0</span></div>
                </div>
                <div class="q-display" id="u1-q-text">题目加载中...</div>
                
                <div class="pv-chart" id="u1-chart">
                    <!-- Dynamic Inputs -->
                </div>
                
                <div style="margin-top: 30px;">
                    <button class="check-btn" onclick="MathGameU1.check()">🚀 提交答案</button>
                    <div id="u1-msg" style="height: 30px; margin-top: 10px; font-weight: bold;"></div>
                </div>
            </div>
        </div>

        <!-- GAME U2: Angle Detective -->
        <div id="math-game-u2" class="section">
            <div class="game-container">
                <div class="game-header">
                    <span>第二单元：线与角</span>
                    <div class="game-score">⭐ 得分: <span id="u2-score">0</span></div>
                </div>
                <div class="u2-canvas-container">
                    <canvas id="u2-canvas" width="300" height="300"></canvas>
                </div>
                <div style="text-align:center; margin-bottom:20px; color:#7f8c8d;">这是一个什么角？</div>
                <div class="u2-options" id="u2-options">
                    <button class="u2-btn" onclick="MathGameU2.check(this, 'acute')">锐角 (&lt;90°)</button>
                    <button class="u2-btn" onclick="MathGameU2.check(this, 'right')">直角 (=90°)</button>
                    <button class="u2-btn" onclick="MathGameU2.check(this, 'obtuse')">钝角 (&gt;90°)</button>
                    <button class="u2-btn" onclick="MathGameU2.check(this, 'flat')">平角 (=180°)</button>
                    <button class="u2-btn" onclick="MathGameU2.check(this, 'round')">周角 (=360°)</button>
                </div>
                <div id="u2-msg" style="height: 30px; margin-top: 15px; font-weight: bold;"></div>
                <button class="check-btn" style="background:#8e44ad; margin-top:10px;" onclick="MathGameU2.next()">下一题 ➡️</button>
            </div>
        </div>

        <!-- GAME U3: Space Math -->
        <div id="math-game-u3" class="section">
            <div class="game-container" style="max-width: 600px;">
                <div class="game-header">
                    <span>第三单元：乘法 (太空战)</span>
                    <div class="game-score">🚀 击杀: <span id="u3-score">0</span></div>
                </div>
                <div id="u3-game-area">
                    <div style="position:absolute; top:10px; right:10px; color:#ccc; font-size:0.8em;">按回车发射</div>
                    <div id="u3-ship" style="position:absolute; bottom:10px; left:50%; transform:translateX(-50%); font-size:3em;">🚀</div>
                </div>
                <div class="u3-controls">
                    <input type="number" id="u3-input" placeholder="答案..." onkeydown="if(event.key==='Enter') MathGameU3.fire()">
                    <button class="check-btn" style="padding:10px 20px; font-size:1em;" onclick="MathGameU3.fire()">🔥 发射</button>
                </div>
                <div style="margin-top:10px;">
                    <button class="nav-btn" onclick="MathGameU3.start()">▶️ 开始游戏</button>
                    <button class="nav-btn" onclick="MathGameU3.stop()" style="color:#e74c3c;">⏸️ 停止</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CHINESE VIEW -->
    <div id="view-chinese" class="subject-view">
        <nav class="nav-tabs">
            <button class="nav-btn active" onclick="switchTab('chi-mindmap')">🧠 单元导图</button>
            <button class="nav-btn" onclick="switchTab('chi-poems')">📜 古诗背诵</button>
            <button class="nav-btn" onclick="switchTab('chi-idioms')">📖 成语积累</button>
        </nav>
        <div id="chi-mindmap" class="section active">
            <div class="mindmap-container"><svg id="mm-chi"></svg></div>
        </div>
        <div id="chi-poems" class="section">
            <div class="grid-container" id="chi-poems-container"></div>
        </div>
        <div id="chi-idioms" class="section">
            <div class="grid-container" id="chi-idioms-container"></div>
        </div>
    </div>

</div>

<!-- Tooltip -->
<div id="vocab-tooltip"></div>

<!-- Flashcard Overlay -->
<div id="flashcard-overlay">
    <div class="fc-container">
        <button class="fc-close" onclick="closeFlashcardMode()">×</button>
        <div class="fc-card" onclick="this.classList.toggle('flipped')">
            <div class="fc-face fc-front">
                <div class="fc-word" id="fc-front">Text</div>
                <!-- Speaker Button (Added) -->
                <div id="fc-speaker-btn" class="tt-speaker" style="width:60px; height:60px; font-size:2em; margin: 20px auto; background:#f0f4f8; box-shadow:0 4px 10px rgba(0,0,0,0.1);" onclick="event.stopPropagation(); playAudio(currentFcWord)">🔊</div>
                <div style="color:#999; margin-top:20px;">(点击空白处翻转 / 按空格键)</div>
            </div>
            <div class="fc-face fc-back">
                <div class="fc-phonetic" id="fc-back-ph" style="color:#888; margin-bottom:10px; font-family:sans-serif; font-size: 1.2em;"></div>
                <div class="fc-mean" id="fc-back" style="font-size: 1.8em; color: var(--primary-color); font-weight: bold; margin-bottom: 15px;">Mean</div>
                <div id="fc-back-phrase" style="background:#fff3e0; color:#d35400; padding:8px 15px; border-radius:20px; margin:10px 0; display:none; font-weight:bold;"></div>
                <div class="fc-sentence" id="fc-desc" style="color:#555; font-style:italic; border-top: 1px dashed #eee; padding-top: 15px; margin-top: 10px; width: 100%;">Desc</div>
                <div id="fc-back-extras" style="margin-top:15px; font-size:0.9em; color:#999;"></div>
            </div>
        </div>
        <div class="fc-actions">
            <button class="fc-btn" onclick="prevCard()">⬅️ 上一个</button>
            <button class="fc-btn primary" onclick="nextCard()">下一个 ➡️</button>
        </div>
    </div>
</div>

        });
        
        const ic = document.getElementById('chi-idioms-container');
        const iCard = document.createElement('div'); iCard.className = 'card';
        iCard.innerHTML = '<h3>成语积累</h3>';
        DB.chinese.idioms.forEach(i => {
            iCard.innerHTML += `<div class="check-item"><input type="checkbox"><span><strong>${i.k}</strong>: ${i.v}</span></div>`;
        });
        ic.appendChild(iCard);
    }
    
    function toggleMask(el) {
        if(el.classList.contains('masked')) {
            el.innerHTML = el.dataset.text;
            el.classList.remove('masked');
        } else {
            el.dataset.text = el.innerText;
            el.innerHTML = el.innerText.split('').map(c=>Math.random()>0.4?`<span class="hidden-char">_</span>`:c).join('');
            el.classList.add('masked');
        }
    }

    // --- ENGLISH FEATURES (Tooltip, Audio, My Words) ---
    
    const tooltip = document.getElementById('vocab-tooltip');
    let hideTimeout;

    function initTooltips() {
        document.querySelectorAll('.word-trigger').forEach(el => {
            el.addEventListener('mouseover', showTooltip);
            el.addEventListener('mouseout', hideTooltip);
        });
    }

    function showTooltip(e) {
        if(hideTimeout) clearTimeout(hideTimeout);
        const key = e.target.dataset.word;
        const d = DB.english.vocab[key];
        const saved = StorageMgr.isSaved(key);
        
        tooltip.innerHTML = `
            <div class="tt-header">
                <div>
                    <span class="tt-word">${key}</span>
                    <span class="tt-speaker" onclick="playAudio('${key}')">🔊</span>
                    <span class="tt-star ${saved?'active':''}" onclick="toggleSaved('${key}', this)">${saved?'⭐':'☆'}</span>
                </div>
                <span class="tt-phonetic">${d.ph}</span>
            </div>
            <div>${d.phrase ? `<b>短语:</b> ${d.phrase}<br>` : ''} <i>${d.ex}</i></div>
        `;
        
        const rect = e.target.getBoundingClientRect();
        tooltip.style.display = 'block';
        tooltip.style.opacity = 1;
        tooltip.style.top = (rect.bottom + window.scrollY + 10) + 'px';
        tooltip.style.left = rect.left + 'px';
    }

    function hideTooltip() {
        hideTimeout = setTimeout(() => { tooltip.style.opacity=0; setTimeout(()=>tooltip.style.display='none',200); }, 300);
    }
    tooltip.addEventListener('mouseover', ()=>clearTimeout(hideTimeout));
    tooltip.addEventListener('mouseout', hideTooltip);

    window.playAudio = (word) => new Audio(`https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(word)}&type=1`).play();

    // Storage
    const StorageMgr = {
        KEY: 'eng_saved',
        get: () => JSON.parse(localStorage.getItem('eng_saved')||'[]'),
        isSaved: (w) => JSON.parse(localStorage.getItem('eng_saved')||'[]').includes(w),
        toggle: (w) => {
            let s = JSON.parse(localStorage.getItem('eng_saved')||'[]');
            s.includes(w) ? s=s.filter(i=>i!==w) : s.push(w);
            localStorage.setItem('eng_saved', JSON.stringify(s));
            return s.includes(w);
        }
    };
    window.toggleSaved = (w, btn) => {
        const saved = StorageMgr.toggle(w);
        btn.innerHTML = saved ? '⭐' : '☆';
        btn.classList.toggle('active', saved);
        if(document.getElementById('my-words').classList.contains('active')) renderMyWords();
    };
    
    function renderMyWords() {
        const c = document.getElementById('my-words-container');
        const s = StorageMgr.get();
        c.innerHTML = '';
        if(s.length===0) { document.getElementById('empty-state').style.display='block'; return; }
        document.getElementById('empty-state').style.display='none';
        
        const card = document.createElement('div'); card.className='card';
        card.innerHTML = `<h3>🔥 重点复习 (${s.length})</h3>`;
        s.forEach(k => {
            const d = DB.english.vocab[k];
            if(d) card.innerHTML += `<div class="check-item"><input type="checkbox"><span class="word-trigger" data-word="${k}">${k}</span></div>`;
        });
        c.appendChild(card);
        initTooltips();
    }

    // --- FLASHCARDS ---
    window.openFlashcardMode = function() {
        if(currentSubject === 'english') {
            fcList = Object.keys(DB.english.vocab);
        } else if(currentSubject === 'math') {
            fcList = DB.math.flashcards;
        } else {
            alert('语文板块暂无翻卡内容'); return;
        }
        fcList.sort(()=>Math.random()-0.5); fcIndex=0;
        document.getElementById('flashcard-overlay').style.display = 'flex';
        renderFc();
    };
    window.closeFlashcardMode = () => document.getElementById('flashcard-overlay').style.display='none';
    
    function renderFc() {
        const item = fcList[fcIndex];
        const card = document.querySelector('.fc-card');
        card.classList.remove('flipped');
        
        const speakerBtn = document.getElementById('fc-speaker-btn');
        
        if(currentSubject === 'english') {
            currentFcWord = item; // Update global for audio
            const d = DB.english.vocab[item];
            
            // Front
            document.getElementById('fc-front').textContent = item;
            speakerBtn.style.display = 'inline-flex'; // Show speaker
            
            // Back - Rich Content
            document.getElementById('fc-back-ph').textContent = d.ph || '';
            document.getElementById('fc-back').textContent = d.mean;
            
            // Phrase
            const pEl = document.getElementById('fc-back-phrase');
            if(d.phrase) {
                pEl.textContent = "📝 " + d.phrase;
                pEl.style.display = 'inline-block';
            } else {
                pEl.style.display = 'none';
            }
            
            // Sentence
            document.getElementById('fc-desc').textContent = d.ex || '';
            
            // Extras (Synonyms/Antonyms)
            let extras = [];
            if(d.anti) extras.push("↔️ 反义: " + d.anti);
            if(d.related) extras.push("🔗 关联: " + d.related);
            document.getElementById('fc-back-extras').textContent = extras.join('  |  ');
            
        } else { 
            // Math or Chinese
            speakerBtn.style.display = 'none'; // Hide speaker
            
            const frontText = typeof item === 'object' ? item.front : item;
            const backText = typeof item === 'object' ? item.back : '';
            const descText = typeof item === 'object' ? item.desc : '';

            document.getElementById('fc-front').textContent = frontText;
            document.getElementById('fc-back').textContent = backText;
            document.getElementById('fc-back-ph').textContent = '';
            document.getElementById('fc-back-phrase').style.display = 'none';
            document.getElementById('fc-desc').textContent = descText;
            document.getElementById('fc-back-extras').textContent = '';
        }
    }
    
    window.nextCard = () => { if(fcIndex<fcList.length-1) { fcIndex++; renderFc(); }};
    window.prevCard = () => { if(fcIndex>0) { fcIndex--; renderFc(); }};

    // --- PROGRESS ---
    function updateProgress() {
        const v = document.querySelector('.subject-view.active');
        const inputs = v.querySelectorAll('input[type="checkbox"]');
        const checked = Array.from(inputs).filter(i=>i.checked).length;
        const pct = inputs.length ? Math.round((checked/inputs.length)*100) : 0;
        
        document.getElementById('progress-bar').style.width = pct + '%';
        
        // Confetti Logic: Trigger every 3 items checked
        if(checked > lastCheckedCount) {
            if(pct === 100) {
                fireConfetti('full');
            } else if(Math.floor(checked / 3) > Math.floor(lastCheckedCount / 3)) {
                fireConfetti('mini');
            }
        }
        lastCheckedCount = checked;
    }
    
    function fireConfetti(mode = 'mini') {
        if(mode === 'mini') {
            // Scalar increased to 1.6 (double original 0.8)
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 }, scalar: 1.6 });
        } else {
            // Full Spectacular - Scalar increased to 2.0
            const duration = 5000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0, scalar: 2.0 };
            const random = (min, max) => Math.random() * (max - min) + min;

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                const particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
            
            // Also launch some from center
            confetti({ particleCount: 100, spread: 100, origin: { y: 0.6 }, scalar: 2.0 });
        }
    }

    // --- MATH GAME U1 LOGIC ---
    const MathGameU1 = {
        data: [
            { t: "二千零五万零三十", v: "20050030" },
            { t: "三亿零八十万", v: "300800000" },
            { t: "四千五百万", v: "45000000" },
            { t: "一亿两千万", v: "120000000" },
            { t: "五十万零五", v: "500005" },
            { t: "七千零一万", v: "70010000" },
            { t: "九亿零九", v: "900000009" }
        ],
        idx: 0,
        score: 0,
        
        init: () => {
            MathGameU1.idx = 0;
            MathGameU1.score = 0;
            MathGameU1.render();
        },
        
        render: () => {
            const q = MathGameU1.data[MathGameU1.idx];
            document.getElementById('u1-score').innerText = MathGameU1.score;
            document.getElementById('u1-q-text').innerText = q.t;
            document.getElementById('u1-msg').innerText = "";
            
            // Build Inputs based on length (Groups of 4)
            const len = q.v.length;
            const chart = document.getElementById('u1-chart');
            chart.innerHTML = '';
            
            // Labels for levels
            const labels = ["个", "十", "百", "千", "万", "十万", "百万", "千万", "亿", "十亿", "百亿"];
            
            let html = '';
            // Process from high to low
            let groupHTML = '<div class="pv-group">';
            
            for(let i=len-1; i>=0; i--) {
                // If crossing group boundary (4 digits), close and start new group
                if(i !== len-1 && (i+1)%4 === 0) {
                    groupHTML += '</div><div class="pv-group">';
                }
                
                groupHTML += `
                    <div class="pv-box">
                        <span class="pv-label">${labels[i]}</span>
                        <input type="tel" maxlength="1" class="pv-input" id="u1-in-${i}" oninput="MathGameU1.focusNext(this, ${i})">
                    </div>
                `;
            }
            groupHTML += '</div>';
            chart.innerHTML = groupHTML;
            
            // Focus first
            setTimeout(() => {
                const el = document.getElementById(`u1-in-${len-1}`);
                if(el) el.focus();
            }, 100);
        },
        
        focusNext: (el, idx) => {
            if(el.value.length === 1 && idx > 0) {
                document.getElementById(`u1-in-${idx-1}`).focus();
            }
        },
        
        check: () => {
            const q = MathGameU1.data[MathGameU1.idx];
            let userVal = "";
            let correct = true;
            
            for(let i=q.v.length-1; i>=0; i--) {
                const input = document.getElementById(`u1-in-${i}`);
                const val = input.value;
                userVal += val;
                
                if(val === q.v[q.v.length - 1 - i]) {
                    input.classList.add('correct');
                    input.classList.remove('wrong');
                } else {
                    input.classList.add('wrong');
                    correct = false;
                }
            }
            
            const msg = document.getElementById('u1-msg');
            if(correct) {
                MathGameU1.score += 10;
                document.getElementById('u1-score').innerText = MathGameU1.score;
                msg.innerHTML = "<span style='color:green'>🎉 太棒了！答对了！</span>";
                fireConfetti('full');
                setTimeout(() => {
                    MathGameU1.idx = (MathGameU1.idx + 1) % MathGameU1.data.length;
                    MathGameU1.render();
                }, 2000);
            } else {
                msg.innerHTML = "<span style='color:red'>❌ 再试一次哦！</span>";
            }
        }
    };

    // --- MATH GAME U2: Angle Detective ---
    const MathGameU2 = {
        score: 0,
        currentType: '',
        ctx: null,
        
        init: () => {
            MathGameU2.score = 0;
            const canvas = document.getElementById('u2-canvas');
            MathGameU2.ctx = canvas.getContext('2d');
            MathGameU2.next();
        },
        
        next: () => {
            document.getElementById('u2-msg').innerHTML = '';
            document.querySelectorAll('.u2-btn').forEach(b => {
                b.classList.remove('correct', 'wrong');
                b.disabled = false;
            });
            document.getElementById('u2-score').innerText = MathGameU2.score;
            MathGameU2.drawRandomAngle();
        },
        
        drawRandomAngle: () => {
            const ctx = MathGameU2.ctx;
            ctx.clearRect(0,0,300,300);
            const types = ['acute', 'right', 'obtuse', 'flat', 'round'];
            // Weights: acute(30%), right(20%), obtuse(30%), flat(10%), round(10%)
            const r = Math.random();
            let type = 'acute';
            if(r>0.3) type='right';
            if(r>0.5) type='obtuse';
            if(r>0.8) type='flat';
            if(r>0.9) type='round';
            MathGameU2.currentType = type;
            
            let angle = 0;
            switch(type) {
                case 'acute': angle = Math.floor(Math.random()*80)+5; break; // 5-85
                case 'right': angle = 90; break;
                case 'obtuse': angle = Math.floor(Math.random()*80)+95; break; // 95-175
                case 'flat': angle = 180; break;
                case 'round': angle = 360; break;
            }
            
            // Draw
            const cx=150, cy=150, radius=100;
            const startRad = Math.random() * Math.PI * 2; // Random rotation
            const endRad = startRad - (angle * Math.PI / 180); // Counter-clockwise
            
            ctx.beginPath();
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#2c3e50';
            
            // Line 1
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(startRad)*radius, cy + Math.sin(startRad)*radius);
            
            // Line 2
            if(type !== 'round') {
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(endRad)*radius, cy + Math.sin(endRad)*radius);
            } else {
                // For round angle, draw a slightly offset line or just one line with full arc
                // Ideally visual representation of round angle is a ray with a full circle arc
            }
            ctx.stroke();
            
            // Draw Arc
            ctx.beginPath();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#e74c3c';
            if(type === 'right') {
                // Draw square symbol? Simplified to arc for now or implement later
                ctx.arc(cx, cy, 30, endRad, startRad); 
            } else {
                ctx.arc(cx, cy, 30, endRad, startRad);
            }
            ctx.stroke();
            
            // Text for debug? No, keep it visual.
        },
        
        check: (btn, type) => {
            if(btn.classList.contains('correct') || btn.classList.contains('wrong')) return;
            
            if(type === MathGameU2.currentType) {
                btn.classList.add('correct');
                document.getElementById('u2-msg').innerHTML = "<span style='color:green'>🎉 正确！</span>";
                MathGameU2.score += 10;
                document.getElementById('u2-score').innerText = MathGameU2.score;
                fireConfetti('mini');
                setTimeout(MathGameU2.next, 1000);
            } else {
                btn.classList.add('wrong');
                document.getElementById('u2-msg').innerHTML = "<span style='color:red'>❌ 错了，再看看！</span>";
            }
        }
    };

    // --- MATH GAME U3: Space Math ---
    const MathGameU3 = {
        active: false,
        score: 0,
        meteors: [],
        spawnTimer: null,
        gameLoop: null,
        
        start: () => {
            if(MathGameU3.active) return;
            MathGameU3.active = true;
            MathGameU3.score = 0;
            MathGameU3.meteors = [];
            document.getElementById('u3-score').innerText = 0;
            document.getElementById('u3-input').value = '';
            document.getElementById('u3-input').focus();
            
            // Clean area
            document.querySelectorAll('.meteor, .laser-beam').forEach(e => e.remove());
            
            MathGameU3.spawnTimer = setInterval(MathGameU3.spawnMeteor, 2500); // Every 2.5s
            MathGameU3.gameLoop = requestAnimationFrame(MathGameU3.loop);
        },
        
        stop: () => {
            MathGameU3.active = false;
            clearInterval(MathGameU3.spawnTimer);
            cancelAnimationFrame(MathGameU3.gameLoop);
        },
        
        spawnMeteor: () => {
            const area = document.getElementById('u3-game-area');
            const m = document.createElement('div');
            m.className = 'meteor';
            m.style.left = Math.random() * (area.clientWidth - 100) + 'px';
            m.style.top = '-100px';
            
            // Generate Question (3-digit * 2-digit estimation or simple math)
            // Focus on mental math: e.g., 25*4, 125*8, 40*50, 300/5
            const types = ['mul_simple', 'mul_est', 'div_simple'];
            const t = types[Math.floor(Math.random()*types.length)];
            let qText = '', ans = 0;
            
            if(t === 'mul_simple') { // 25*4, 15*6
                const a = [25, 125, 15, 12, 11, 20, 50][Math.floor(Math.random()*7)];
                const b = [2, 4, 8, 3, 5, 6, 9][Math.floor(Math.random()*7)];
                qText = `${a} × ${b}`;
                ans = a * b;
            } else if (t === 'mul_est') { // 40*60
                const a = Math.floor(Math.random()*9+1)*10; // 10-90
                const b = Math.floor(Math.random()*9+1)*100; // 100-900
                qText = `${b} × ${a}`;
                ans = a * b;
            } else { // 400 / 20
                const b = Math.floor(Math.random()*9+1)*10;
                const res = Math.floor(Math.random()*9+1)*10;
                const a = b * res;
                qText = `${a} ÷ ${b}`;
                ans = res;
            }
            
            m.innerText = qText;
            m.dataset.ans = ans;
            area.appendChild(m);
            MathGameU3.meteors.push({ el: m, speed: Math.random()*0.5 + 0.5 });
        },
        
        loop: () => {
            if(!MathGameU3.active) return;
            
            const areaHeight = document.getElementById('u3-game-area').clientHeight;
            
            MathGameU3.meteors.forEach((mObj, idx) => {
                const currentTop = parseFloat(mObj.el.style.top);
                if(currentTop > areaHeight) {
                    mObj.el.remove();
                    MathGameU3.meteors.splice(idx, 1);
                    // Game Over logic could go here
                } else {
                    mObj.el.style.top = (currentTop + mObj.speed) + 'px';
                }
            });
            
            MathGameU3.gameLoop = requestAnimationFrame(MathGameU3.loop);
        },
        
        fire: () => {
            const input = document.getElementById('u3-input');
            const val = parseInt(input.value);
            if(isNaN(val)) return;
            
            // Find meteor
            const hitIdx = MathGameU3.meteors.findIndex(m => parseInt(m.el.dataset.ans) === val);
            
            if(hitIdx !== -1) {
                // HIT!
                const mObj = MathGameU3.meteors[hitIdx];
                MathGameU3.createLaser(mObj.el);
                mObj.el.classList.add('boom');
                setTimeout(() => mObj.el.remove(), 200);
                MathGameU3.meteors.splice(hitIdx, 1);
                
                MathGameU3.score += 10;
                document.getElementById('u3-score').innerText = MathGameU3.score;
                input.value = '';
                fireConfetti('mini');
            } else {
                // Miss
                input.style.borderColor = 'red';
                setTimeout(()=>input.style.borderColor = 'var(--math-color)', 200);
            }
        },
        
        createLaser: (targetEl) => {
            const area = document.getElementById('u3-game-area');
            const laser = document.createElement('div');
            laser.className = 'laser-beam';
            
            const shipX = area.clientWidth / 2;
            const targetRect = targetEl.getBoundingClientRect();
            const areaRect = area.getBoundingClientRect();
            
            const targetX = targetRect.left - areaRect.left + targetRect.width/2;
            const targetY = targetRect.top - areaRect.top + targetRect.height/2;
            
            const deltaX = targetX - shipX;
            const deltaY = targetY - area.clientHeight; // ship is at bottom
            const dist = Math.sqrt(deltaX*deltaX + deltaY*deltaY);
            const angle = Math.atan2(deltaY, deltaX) * 180 / Math.PI + 90; // adjust for vertical origin
            
            laser.style.height = dist + 'px';
            laser.style.left = shipX + 'px';
            laser.style.transform = `rotate(${angle}deg)`;
            
            area.appendChild(laser);
            setTimeout(() => laser.remove(), 100);
        }
    };
